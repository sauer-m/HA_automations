alias: Präsenzmelder Badezimmer
description: Präsenz im Bad -> Hintergrundbeleuchtung an, aber nur bei Dunkelheit (unter max_lux). Keine Präsenz mehr ->
  aus.
mode: restart
variables:
  bath_light: light.badezimmerlicht_hintergrundbeleuchtung
  illuminance_sensor: sensor.prasenzmelder_badezimmer_illuminance
  max_lux: 50
triggers:
- trigger: state
  entity_id:
  - binary_sensor.prasenzmelder_badezimmer_presence
  to:
  - 'on'
  id: presence_on
- trigger: state
  entity_id:
  - binary_sensor.prasenzmelder_badezimmer_presence
  to:
  - 'off'
  id: presence_off
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: presence_on
    - condition: template
      value_template: '{{ states(illuminance_sensor) | float(0) < max_lux }}'
    sequence:
    - action: light.turn_on
      data:
        brightness_pct: 100
      target:
        entity_id: '{{ bath_light }}'
  - conditions:
    - condition: trigger
      id: presence_off
    sequence:
    - action: light.turn_off
      data: {}
      target:
        entity_id: '{{ bath_light }}'
