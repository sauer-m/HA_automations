alias: Abwesenheit
description: Schalter input_boolean.abwesenheit (Helfer, muss existieren). An -> alle Lichter aus, HmIP Urlaubsmodus,
  Push an die Companion-App, falls noch ein Fenster oder die Terrassentür offen ist. Aus -> Urlaubsmodus aus. Kommt
  jemand nach Hause, wird der Schalter zurückgesetzt.
mode: queued
variables:
  away_switch: input_boolean.abwesenheit
  persons:
  - person.sauerm
  - person.sarah
  windows:
  - binary_sensor.wohnzimmerfenster
  - binary_sensor.esszimmerfenster
  - binary_sensor.schlafzimmerfenster
  - binary_sensor.badezimmerfenster
  - binary_sensor.terrassentur
  vacation_temperature: 16
  vacation_days: 30
triggers:
- trigger: state
  entity_id: input_boolean.abwesenheit
  to: 'on'
  id: an
- trigger: state
  entity_id: input_boolean.abwesenheit
  to: 'off'
  id: aus
- trigger: state
  entity_id:
  - person.sauerm
  - person.sarah
  to: home
  id: da
conditions: []
actions:
- choose:
  - alias: Abwesenheit an
    conditions:
    - condition: trigger
      id: an
    sequence:
    - action: light.turn_off
      target:
        entity_id: all
    - action: homematicip_cloud.activate_vacation
      data:
        temperature: '{{ vacation_temperature }}'
        endtime: '{{ (now() + timedelta(days=vacation_days)).strftime(''%Y-%m-%d %H:%M'') }}'
    - variables:
        open_windows: '{{ windows | select(''is_state'', ''on'') | map(''state_attr'', ''friendly_name'') | map(''replace'',
          '' Tür'', '''') | map(''trim'') | list }}'
    - if:
      - condition: template
        value_template: '{{ open_windows | count > 0 }}'
      then:
      - action: notify.mobile_app_sm_f741b
        data:
          title: Abwesenheit – Fenster offen
          message: 'Noch offen: {{ open_windows | join('', '') }}'
      - action: notify.mobile_app_iphone_17_pro
        data:
          title: Abwesenheit – Fenster offen
          message: 'Noch offen: {{ open_windows | join('', '') }}'
  - alias: Abwesenheit aus -> Urlaubsmodus aus
    conditions:
    - condition: trigger
      id: aus
    sequence:
    - action: homematicip_cloud.deactivate_vacation
      data: {}
  - alias: Jemand kommt heim -> Schalter zurücksetzen
    conditions:
    - condition: trigger
      id: da
    - condition: state
      entity_id: input_boolean.abwesenheit
      state: 'on'
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: '{{ away_switch }}'
