<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1540" role="img" aria-label="Bambu Lab A1 mini">
  <defs>
    <linearGradient id="alu" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c3c6c9"/>
      <stop offset="0.5" stop-color="#dfe1e3"/>
      <stop offset="1" stop-color="#bfc2c5"/>
    </linearGradient>
    <linearGradient id="aluv" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#d9dbdd"/>
      <stop offset="1" stop-color="#b8bbbe"/>
    </linearGradient>
  </defs>

  <!-- Kabelbogen vom Druckkopf zur Säule -->
  <path d="M706 352 C700 120 1000 60 1120 210 C1170 270 1150 600 1130 760" fill="none" stroke="#222326" stroke-width="10" stroke-linecap="round"/>

  <!-- Z-Säule -->
  <rect x="1010" y="300" width="120" height="690" rx="12" fill="url(#alu)"/>
  <rect x="1028" y="330" width="14" height="640" rx="7" fill="#9fa4a9"/>
  <rect x="1010" y="290" width="120" height="34" rx="10" fill="#3a3c40"/>

  <!-- X-Arm (Ausleger) -->
  <rect x="420" y="430" width="610" height="70" rx="10" fill="url(#aluv)"/>
  <rect x="420" y="452" width="610" height="10" fill="#a9aeb3"/>
  <!-- Motor links am Arm -->
  <rect x="360" y="436" width="70" height="58" rx="8" fill="#5b5f64"/>
  <rect x="372" y="494" width="44" height="34" rx="6" fill="#2b2d30"/>

  <!-- Druckkopf -->
  <rect x="644" y="352" width="126" height="190" rx="14" fill="#d0d3d6"/>
  <rect x="656" y="366" width="102" height="64" rx="8" fill="#b2b6ba"/>
  <circle cx="707" cy="398" r="20" fill="#3a3c40"/>
  <circle cx="707" cy="398" r="8" fill="#00ae42"/>
  <rect x="664" y="446" width="86" height="12" rx="4" fill="#3a3c40"/>
  <text x="707" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#4a4d52">Bambu Lab</text>
  <rect x="676" y="542" width="62" height="34" rx="6" fill="#2b2d30"/>
  <path d="M698 576 L707 594 L716 576 Z" fill="#c9a227"/>

  <!-- Druckbett (Bettschubser) -->
  <rect x="330" y="880" width="560" height="22" rx="4" fill="#222326"/>
  <rect x="340" y="902" width="540" height="10" rx="4" fill="#9ea3a8"/>
  <rect x="560" y="912" width="100" height="70" rx="6" fill="#2b2d30"/>

  <!-- Sockel -->
  <rect x="300" y="980" width="860" height="200" rx="24" fill="url(#aluv)"/>
  <rect x="300" y="980" width="860" height="22" rx="10" fill="#cfd2d5"/>
  <rect x="330" y="1030" width="560" height="10" rx="5" fill="#a9aeb3"/>

  <!-- Display am Sockel -->
  <rect x="930" y="1040" width="200" height="110" rx="12" fill="#2b2d30"/>
  <rect x="940" y="1050" width="180" height="90" rx="8" fill="#16181a"/>
  <rect x="954" y="1064" width="70" height="12" rx="3" fill="#3c4045"/>
  <rect x="954" y="1086" width="100" height="12" rx="3" fill="#3c4045"/>
  <rect x="954" y="1108" width="50" height="12" rx="3" fill="#00ae42"/>

  <!-- Logo auf dem Sockel -->
  <text x="330" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#55595e">Bambu Lab</text>
  <text x="530" y="1150" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" fill="#55595e">A1 mini</text>

  <!-- Füße -->
  <rect x="330" y="1180" width="120" height="16" rx="5" fill="#2a2b2d"/>
  <rect x="1010" y="1180" width="120" height="16" rx="5" fill="#2a2b2d"/>
</svg>
