  <circle cx="480" cy="285" r="10" fill="#5a5e63"/>
  <rect x="530" y="250" width="58" height="14" rx="3" fill="#3c4045"/>
  <rect x="530" y="272" width="58" height="14" rx="3" fill="#3c4045"/>
