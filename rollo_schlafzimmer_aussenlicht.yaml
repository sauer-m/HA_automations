alias: Rollo Schlafzimmer nach Außenlicht
description: Schließt das Rollo, wenn es draußen dunkel ist (Sonne < -3°) und im Schlafzimmer Licht brennt; öffnet
  es morgens, wenn es draußen hell ist (Sonne > 3°). Nicht während Heimkino Schlafzimmer.
mode: single
triggers:
- trigger: numeric_state
  entity_id: sun.sun
  attribute: elevation
  below: -3
  id: draussen_dunkel
- trigger: state
  entity_id: light.schlafzimmer_gesamt
  to: 'on'
  id: licht_an
- trigger: numeric_state
  entity_id: sun.sun
  attribute: elevation
  above: 3
  id: draussen_hell
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - draussen_dunkel
      - licht_an
    - condition: numeric_state
      entity_id: sun.sun
      attribute: elevation
      below: -3
    - condition: state
      entity_id: light.schlafzimmer_gesamt
      state: 'on'
    - condition: not
      conditions:
      - condition: state
        entity_id: cover.rollo_schlafzimmer
        state: closed
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.rollo_schlafzimmer
  - conditions:
    - condition: trigger
      id: draussen_hell
    - condition: state
      entity_id: input_boolean.heimkino_schlafzimmer_aktiv
      state: 'off'
    - condition: not
      conditions:
      - condition: state
        entity_id: cover.rollo_schlafzimmer
        state: open
    sequence:
    - action: cover.open_cover
      target:
        entity_id: cover.rollo_schlafzimmer
