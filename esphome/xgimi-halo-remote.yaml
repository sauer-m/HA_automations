esphome:
  name: xgimi-halo-remote
  friendly_name: "XGIMI Halo+ Remote"

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret REDACTED_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "XGIMI Halo Remote"
    password: !secret REDACTED_password

captive_portal:

esp32_ble:
  id: ble
  advertising: true
  name: "Bluetooth 4.0 RC"

button:
  - platform: restart
    name: "Restart"

  - platform: template
    name: "XGIMI Projector Wakeup"
    icon: "mdi:projector"
    on_press:
      - repeat:
          count: 3
          then:
            - lambda: |-
                std::vector<uint8_t> data = {
                  0x46, 0x00,
                  0x53, 0x86, 0xb4, 0x44, 0x12, 0xc9, 0x70,
                  0xff, 0xff, 0xff,
                  0x30, 0x43, 0x52, 0x4b, 0x54, 0x4d
                };
                id(ble).advertising_set_manufacturer_data(data);
            - delay: 1s
            - lambda: |-
                std::vector<uint8_t> data = {0x46, 0x00};
                id(ble).advertising_set_manufacturer_data(data);
            - delay: 1s