substitutions:
  name: usb-relay
  friendly_name: "USB Relay"
  default_state: "RESTORE_DEFAULT_OFF"
  
esphome:
  name: brunnen-wohnzimmer
  friendly_name: Brunnen Wohnzimmer

esp8266:
  board: esp01_1m
  restore_from_flash: True

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret REDACTED_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Brunnen Wohnzim Fallback Hotspot
    password: !secret REDACTED_password

captive_portal:

time:
  - platform: homeassistant

# PWM-Ausgang für die Pumpe
output:
  - platform: esp8266_pwm
    id: pump_pwm
    pin: GPIO5
    frequency: 1kHz
    min_power: 30%
    zero_means_zero: true

# Pumpe mit Geschwindigkeitsregler
fan:
  - platform: speed
    name: "Brunnen Wohnzimmer"
    id: pump
    output: pump_pwm
    speed_count: 100
    restore_mode: RESTORE_DEFAULT_OFF

    on_turn_on:
      - switch.turn_on: green_led
      - switch.turn_off: blue_led

    on_turn_off:
      - switch.turn_off: green_led
      - switch.turn_off: blue_led

# Grüne Betriebs-LED
switch:
  # Grüne LED: leuchtet bei laufender Pumpe
  - platform: gpio
    id: green_led
    internal: true
    pin: GPIO14
    restore_mode: ALWAYS_OFF

  # Blaue LED: dauerhaft aus
  - platform: gpio
    id: blue_led
    internal: true
    pin: GPIO16
    restore_mode: ALWAYS_OFF

# Hardwaretaste
binary_sensor:
  - platform: gpio
    id: hardware_button
    pin:
      number: GPIO4
      inverted: true
      mode: INPUT_PULLUP
    on_press:
      - fan.toggle: pump

# WiFi Signal Sensor
sensor:
  - platform: wifi_signal
    name: "WiFi Status"
    update_interval: 60s

# Restart button
button:
  - platform: restart
    name: "Restart"