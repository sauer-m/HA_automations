substitutions:
  device_name: landroid-cam
  friendly_name: "Landroid Kamera"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "ESP32-S3 N16R8 OV2640 Kamera fuer Worx Landroid"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: onboard_rgb
          brightness: 30%
          red: 100%
          green: 60%
          blue: 0%
      - delay: 3s
      # Manuellen Standardwert auf 100 % Weiss vorbelegen.
            # Manuellen Standardwert auf 100 % Weiss vorbelegen.
      - light.turn_on:
          id: onboard_rgb
          brightness: 100%
          red: 100%
          green: 100%
          blue: 100%
          effect: none
      - light.turn_off: onboard_rgb

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

globals:
  - id: landroid_error_active
    type: bool
    restore_value: false
    initial_value: "false"

api:
  encryption:
    key: !secret landroid_cam_api_key
  reboot_timeout: 15min
  actions:
    # Wird von der HA-Fehlerautomation aufgerufen.
    - action: report_landroid_error
      variables:
        error_code: string
      then:
        - lambda: |-
            id(landroid_error_active) = true;
            id(last_landroid_error).publish_state(error_code);
        - light.turn_on:
            id: onboard_rgb
            brightness: 40%
            red: 100%
            green: 0%
            blue: 0%
            effect: "Warnblinken"

    - action: clear_landroid_error
      then:
        - lambda: |-
            id(landroid_error_active) = false;
            id(last_landroid_error).publish_state("Kein Fehler");
        - light.turn_on:
            id: onboard_rgb
            brightness: 100%
            red: 100%
            green: 100%
            blue: 100%
            effect: none
        - light.turn_off: onboard_rgb

ota:
  - platform: esphome
    password: !secret landroid_cam_ota_password
    on_begin:
      then:
        - light.turn_on:
            id: onboard_rgb
            brightness: 35%
            red: 100%
            green: 60%
            blue: 0%
            effect: "Schnelles Pulsieren"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: false
  reboot_timeout: 15min
  ap:
    ssid: "Landroid-Cam-Fallback"
    password: !secret landroid_cam_fallback_password
  on_connect:
    then:
      - if:
          condition:
            lambda: "return !id(landroid_error_active);"
          then:
            - light.turn_on:
                id: onboard_rgb
                brightness: 25%
                red: 0%
                green: 100%
                blue: 0%
            - delay: 2s
            # Nach der WLAN-Anzeige wieder den manuellen Standard vorbelegen.
            - light.turn_on:
                id: onboard_rgb
                brightness: 100%
                red: 100%
                green: 100%
                blue: 100%
                effect: none
            - light.turn_off: onboard_rgb
  on_disconnect:
    then:
      - light.turn_on:
          id: onboard_rgb
          brightness: 25%
          red: 100%
          green: 0%
          blue: 0%

captive_portal:

# Bedienoberflaeche; der Kamerastream selbst laeuft separat auf 8080.
web_server:
  port: 80
  version: 3
  local: true
  auth:
    username: service
    password: !secret landroid_cam_web_password

i2c:
  - id: camera_i2c
    sda: GPIO4
    scl: GPIO5
    scan: false

esp32_camera:
  id: landroid_camera
  name: "Landroid Kamera"
  i2c_id: camera_i2c
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13

  resolution: 800x600
  jpeg_quality: 12
  max_framerate: 10 fps
  idle_framerate: 0.2 fps
  frame_buffer_count: 2
  frame_buffer_location: PSRAM

  vertical_flip: false
  horizontal_mirror: false
  brightness: 0
  contrast: 0
  saturation: 0
  aec_mode: auto
  aec2: false
  ae_level: 0
  agc_mode: auto
  agc_gain_ceiling: 8x
  wb_mode: auto

# Genau ein gleichzeitiger MJPEG-Stream, aber mehrere Snapshot-Clients.
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

number:
  - platform: template
    name: "Helligkeit"
    id: camera_brightness
    icon: mdi:brightness-6
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(landroid_camera).set_brightness((int) x);
          id(landroid_camera).update_camera_parameters();

  - platform: template
    name: "Kontrast"
    id: camera_contrast
    icon: mdi:contrast-box
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(landroid_camera).set_contrast((int) x);
          id(landroid_camera).update_camera_parameters();

  - platform: template
    name: "Saettigung"
    id: camera_saturation
    icon: mdi:palette
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(landroid_camera).set_saturation((int) x);
          id(landroid_camera).update_camera_parameters();

  - platform: template
    name: "Belichtungskorrektur"
    id: camera_ae_level
    icon: mdi:weather-sunny
    min_value: -2
    max_value: 2
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          id(landroid_camera).set_ae_level((int) x);
          id(landroid_camera).update_camera_parameters();

switch:
  - platform: template
    name: "Horizontal spiegeln"
    id: camera_horizontal_mirror
    icon: mdi:reflect-horizontal
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(landroid_camera).set_horizontal_mirror(true);
          id(landroid_camera).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(landroid_camera).set_horizontal_mirror(false);
          id(landroid_camera).update_camera_parameters();

  - platform: template
    name: "Vertikal spiegeln"
    id: camera_vertical_flip
    icon: mdi:reflect-vertical
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: |-
          id(landroid_camera).set_vertical_flip(true);
          id(landroid_camera).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(landroid_camera).set_vertical_flip(false);
          id(landroid_camera).update_camera_parameters();

  - platform: template
    name: "Testbild"
    id: camera_test_pattern
    icon: mdi:test-tube
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(landroid_camera).set_test_pattern(true);
          id(landroid_camera).update_camera_parameters();
    turn_off_action:
      - lambda: |-
          id(landroid_camera).set_test_pattern(false);
          id(landroid_camera).update_camera_parameters();

light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb
    name: "LED"
    pin: GPIO48
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

    # Eine manuelle Farbe darf den Status voruebergehend ueberlagern.
    # Beim Ausschalten wird ein weiterhin bestehender Fehler wieder angezeigt.
    on_turn_off:
      then:
        - delay: 250ms
        - if:
            condition:
              lambda: "return id(landroid_error_active);"
            then:
              - light.turn_on:
                  id: onboard_rgb
                  brightness: 40%
                  red: 100%
                  green: 0%
                  blue: 0%
                  effect: "Warnblinken"
            else:
              - if:
                  condition:
                    not:
                      wifi.connected:
                  then:
                    - light.turn_on:
                        id: onboard_rgb
                        brightness: 25%
                        red: 100%
                        green: 0%
                        blue: 0%
                        effect: none

    effects:
      - pulse:
          name: "Langsames Pulsieren"
          transition_length: 1s
          update_interval: 1s
      - pulse:
          name: "Schnelles Pulsieren"
          transition_length: 250ms
          update_interval: 250ms
      - strobe:
          name: "Warnblinken"
          colors:
            - state: true
              brightness: 40%
              red: 100%
              green: 0%
              blue: 0%
              duration: 300ms
            - state: false
              duration: 300ms

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

event:
  - platform: template
    name: "Snapshot-Anforderung"
    id: snapshot_request
    icon: mdi:camera
    event_types:
      - manual

button:
  - platform: restart
    name: "Neustart"
    entity_category: diagnostic
  - platform: safe_mode
    name: "Abgesicherter Start"
    entity_category: diagnostic
  - platform: template
    name: "Manuellen Snapshot anfordern"
    icon: mdi:camera
    on_press:
      - event.trigger:
          id: snapshot_request
          event_type: manual
  - platform: template
    name: "LED testen"
    icon: mdi:led-on
    on_press:
      - light.turn_on:
          id: onboard_rgb
          brightness: 100%
          red: 100%
          green: 100%
          blue: 100%
      - delay: 2s
      - light.turn_off: onboard_rgb
  - platform: template
    name: "180 Grad drehen"
    icon: mdi:rotate-180
    on_press:
      - switch.turn_on: camera_horizontal_mirror
      - switch.turn_on: camera_vertical_flip
  - platform: template
    name: "Kameraeinstellungen zuruecksetzen"
    icon: mdi:camera-retake
    on_press:
      - number.set: {id: camera_brightness, value: 0}
      - number.set: {id: camera_contrast, value: 0}
      - number.set: {id: camera_saturation, value: 0}
      - number.set: {id: camera_ae_level, value: 0}
      - switch.turn_off: camera_horizontal_mirror
      - switch.turn_off: camera_vertical_flip
      - switch.turn_off: camera_test_pattern

sensor:
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 300s
    entity_category: diagnostic
  - platform: uptime
    name: "Laufzeit"
    update_interval: 300s
    entity_category: diagnostic
  - platform: internal_temperature
    name: "ESP-Temperatur"
    update_interval: 300s
    entity_category: diagnostic
  - platform: debug
    free:
      name: "Freier Heap"
      entity_category: diagnostic
    min_free:
      name: "Minimaler freier Heap"
      entity_category: diagnostic
    block:
      name: "Groesster freier Speicherblock"
      entity_category: diagnostic
    fragmentation:
      name: "Heap-Fragmentierung"
      entity_category: diagnostic
    psram:
      name: "Freies PSRAM"
      entity_category: diagnostic
    loop_time:
      name: "Maximale Loop-Zeit"
      entity_category: diagnostic

debug:
  update_interval: 300s

text_sensor:
  - platform: template
    name: "Letzter Landroid-Fehler"
    id: last_landroid_error
    icon: mdi:robot-mower-outline
    update_interval: never
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
    ssid:
      name: "WLAN"
      entity_category: diagnostic
    bssid:
      name: "Access Point"
      entity_category: diagnostic
    mac_address:
      name: "MAC-Adresse"
      entity_category: diagnostic
  - platform: version
    name: "ESPHome-Version"
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: "Letzter Neustartgrund"
      entity_category: diagnostic
