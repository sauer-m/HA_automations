esphome:
  name: proficook-pc-wks-1167g
  friendly_name: ProfiCook PC-WKS 1167G

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  baud_rate: 0

api:
  encryption:
    key: !secret proficook_api_encryption_key

ota:
  - platform: esphome
    password: !secret proficook_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  ap:
    ssid: "ProfiCook Fallback"
    password: !secret proficook_fallback_password

captive_portal:

web_server:
  port: 80
  version: 3

uart:
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 9600

tuya:
  id: tuya_mcu

globals:
  - id: kettle_force_boil_until
    type: uint32_t
    restore_value: no
    initial_value: "0"

script:
  - id: kettle_set_climate_target_100
    mode: restart
    then:
      - delay: 1s
      - lambda: |-
          auto call = id(kettle_climate).make_call();
          call.set_target_temperature(100);
          call.perform();

  - id: kettle_force_off
    mode: restart
    then:
      - script.stop: kettle_set_climate_target_100
      - lambda: |-
          id(kettle_force_boil_until) = 0;
          id(tuya_mcu).set_enum_datapoint_value(101, 6);
      - delay: 200ms
      - lambda: |-
          if (id(kettle_climate).mode != climate::CLIMATE_MODE_OFF) {
            auto call = id(kettle_climate).make_call();
            call.set_mode(climate::CLIMATE_MODE_OFF);
            call.perform();
          }

text_sensor:
  - platform: template
    name: "Kettle State"
    icon: mdi:kettle
    id: kettle_state

  - platform: template
    name: "Kettle Error"
    icon: mdi:alert-circle-outline
    id: kettle_error

select:
  - platform: template
    name: "Kettle Mode"
    id: kettle_mode
    options:
      - "45 C"
      - "60 C"
      - "85 C"
      - "100 C"
      - "100 C and off"
      - "Custom"
      - "Off"
    optimistic: true
    set_action:
      lambda: |-
        if (x == "45 C") {
          id(tuya_mcu).set_enum_datapoint_value(101, 0);
        } else if (x == "60 C") {
          id(tuya_mcu).set_enum_datapoint_value(101, 1);
        } else if (x == "85 C") {
          id(tuya_mcu).set_enum_datapoint_value(101, 2);
        } else if (x == "100 C") {
          id(tuya_mcu).set_enum_datapoint_value(101, 3);
        } else if (x == "100 C and off") {
          id(tuya_mcu).set_enum_datapoint_value(101, 4);
        } else if (x == "Custom") {
          id(tuya_mcu).set_enum_datapoint_value(101, 5);
        } else {
          id(tuya_mcu).set_enum_datapoint_value(101, 6);
        }

number:
  - platform: tuya
    name: "Kettle Custom Temperature"
    id: kettle_custom_temperature
    number_datapoint: 102
    icon: mdi:thermometer
    min_value: 35
    max_value: 100
    step: 1

switch:
  - platform: template
    name: "Kettle Power"
    id: kettle_power
    icon: mdi:kettle-steam
    lambda: |-
      if (isnan(id(tuya_mode).state)) {
        return {};
      }
      return static_cast<int>(id(tuya_mode).state) != 6;
    turn_on_action:
      - lambda: |-
          id(tuya_mcu).set_integer_datapoint_value(102, 100);
          id(tuya_mcu).set_enum_datapoint_value(101, 4);
    turn_off_action:
      - script.execute: kettle_force_off

sensor:
  - platform: template
    name: "Kettle Temperature"
    id: kettle_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: tuya
    id: tuya_current_temperature
    sensor_datapoint: 105
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return static_cast<int>(id(tuya_state).state) == 1;
            then:
              - sensor.template.publish:
                  id: kettle_temperature
                  state: 0
            else:
              - sensor.template.publish:
                  id: kettle_temperature
                  state: !lambda "return id(tuya_current_temperature).state;"

  - platform: tuya
    id: kettle_remaining_time
    name: "Kettle Remaining Time"
    icon: mdi:clock-time-five-outline
    sensor_datapoint: 107
    unit_of_measurement: "min"
    accuracy_decimals: 0

  - platform: tuya
    id: tuya_mode
    sensor_datapoint: 101
    on_value:
      then:
        - select.set_index:
            id: kettle_mode
            index: !lambda "return static_cast<int>(id(tuya_mode).state);"
        - if:
            condition:
              lambda: |-
                return static_cast<int>(id(tuya_mode).state) == 6 &&
                       id(kettle_climate).mode != climate::CLIMATE_MODE_OFF;
            then:
              - script.execute: kettle_force_off

  - platform: tuya
    id: tuya_state
    sensor_datapoint: 106
    on_value:
      then:
        - text_sensor.template.publish:
            id: kettle_state
            state: !lambda |-
              switch (static_cast<int>(id(tuya_state).state)) {
                case 1: return "Lifted";
                case 2: return "Standby";
                case 3: return "Heating";
                case 4: return "Cooling";
                case 5: return "Maintaining Temperature";
                default: return "";
              }
        - if:
            condition:
              lambda: |-
                int state = static_cast<int>(id(tuya_state).state);
                return (state == 1 || state == 4 || state == 5) &&
                       id(kettle_climate).mode != climate::CLIMATE_MODE_OFF;
            then:
              - script.execute: kettle_force_off

  - platform: tuya
    id: tuya_error
    sensor_datapoint: 104
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                return id(kettle_temperature).get_raw_state() != 0;
            then:
              - text_sensor.template.publish:
                  id: kettle_error
                  state: !lambda |-
                    switch (static_cast<int>(id(tuya_error).state)) {
                      case 0: return "OK";
                      case 1: return "Empty";
                      case 4: return "Overheated";
                      default: return "Other error";
                    }

climate:
  - platform: thermostat
    name: "Kettle"
    id: kettle_climate
    icon: mdi:kettle-steam
    sensor: kettle_temperature

    min_heating_off_time: 1s
    min_heating_run_time: 1s
    min_idle_time: 1s
    heat_deadband: 0.5
    heat_overrun: 0.0

    visual:
      min_temperature: 35
      max_temperature: 100
      temperature_step: 5

    default_preset: Default
    on_boot_restore_from: default_preset
    preset:
      - name: Default
        default_target_temperature_low: 100
        mode: "OFF"

    heat_mode:
      - lambda: |-
          // Voice assistants usually only set the climate mode to HEAT.
          // Treat that as "boil once and switch off" for safety.
          id(kettle_force_boil_until) = millis() + 15000;
          id(tuya_mcu).set_integer_datapoint_value(102, 100);
          id(tuya_mcu).set_enum_datapoint_value(101, 4);
          id(kettle_set_climate_target_100).execute();

    off_mode:
      - lambda: |-
          id(tuya_mcu).set_enum_datapoint_value(101, 6);

    heat_action:
      - lambda: |-
          id(tuya_mcu).set_integer_datapoint_value(102, 100);
          id(tuya_mcu).set_enum_datapoint_value(101, 4);

    idle_action:
      - logger.log: "Kettle climate idle"

    target_temperature_change_action:
      - lambda: |-
          if (id(kettle_climate).mode == climate::CLIMATE_MODE_HEAT) {
            id(tuya_mcu).set_integer_datapoint_value(102, 100);
            id(tuya_mcu).set_enum_datapoint_value(101, 4);
            return;
          }

          int target = static_cast<int>(roundf(id(kettle_climate).target_temperature));
          if (target < 35) {
            target = 35;
          } else if (target > 100) {
            target = 100;
          }

          id(tuya_mcu).set_integer_datapoint_value(102, target);
