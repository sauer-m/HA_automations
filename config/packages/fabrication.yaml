# Home-Assistant-Package: Fabrication (Drucker, FilaMan, FilaBridge)
# Installation: /config/packages/fabrication.yaml
#
# Datenquellen (LAN, ohne Auth):
#   FilaMan Spoolman-API  http://192.168.1.10:8085/spoolman/api/v1
#   FilaBridge            http://192.168.1.10:5010/api
#
# Lagerlogik: Jede Spule hat in FilaMan genau einen Lagerort (String).
#   - Beginnt der Ort mit einem Druckernamen aus DRUCKER, gilt die Spule als
#     "geladen" in diesem Drucker und zählt zu dessen Standort.
#   - Sonst zählt der Ort zum Standort, mit dessen Namen er beginnt
#     (z. B. "Werkstatt - Regal"), sonst zu "ohne Ort".
# Neuer Drucker / neuer Standort = Eintrag in den Variablen drucker / standort_liste.
# FilaBridge zählt Köpfe ab 0: Toolhead 0 = XL-Kopf 1, Toolhead 1 = XL-Kopf 2.

rest_command:
  filaman_spulen:
    url: http://192.168.1.10:8085/spoolman/api/v1/spool?allow_archived=true
    method: get
    timeout: 10
  filabridge_status:
    url: http://192.168.1.10:5010/api/status
    method: get
    timeout: 10

template:
  - triggers:
      - trigger: time_pattern
        minutes: /2
        id: poll
      - trigger: homeassistant
        event: start
        id: poll
      - trigger: state
        entity_id: sensor.prusa_xl
        to: printing
        not_from: [paused, attention, unavailable, unknown]
        id: druckstart
      - trigger: state
        entity_id: sensor.prusa_xl
        to: finished
        for: "00:01:00"
        id: poll
    actions:
      - action: rest_command.filaman_spulen
        response_variable: fm
        continue_on_error: true
      - action: rest_command.filabridge_status
        response_variable: fb
        continue_on_error: true
      - variables:
          # --- Konfiguration ---------------------------------------------
          standort_liste: ["Werkstatt", "Wohnung"]
          drucker:
            - {name: "Prusa XL", standort: "Werkstatt", slots: 5}
            - {name: "H2C", standort: "Wohnung", slots: 24}
            - {name: "A1 Mini", standort: "Wohnung", slots: 4}
          schwelle_g: 150
          # ----------------------------------------------------------------
          ok: "{{ fm is defined and fm.status == 200 and fm.content is list }}"
          alle: "{{ fm.content if ok else [] }}"
          spulen: >-
            {% set ns = namespace(l=[]) %}
            {% for s in alle if not s.get('archived', false) %}
              {% set f = s.get('filament', {}) %}
              {% set w = s.get('initial_weight') or f.get('weight') or 0 %}
              {% set p = s.get('price') if s.get('price') is not none else f.get('price') %}
              {% set ort = s.get('location') or '' %}
              {% set d = drucker | selectattr('name', 'in', [ort.split(' - ')[0]]) | first | default(none) %}
              {% set so = d.standort if d else
                 (standort_liste | select('in', [ort.split(' - ')[0]]) | first | default('ohne Ort')) %}
              {% set ns.l = ns.l + [{
                'id': s.id,
                'name': f.get('name', ''),
                'hersteller': (f.get('vendor') or {}).get('name', ''),
                'material': f.get('material', ''),
                'farbe': '#' ~ (f.get('color_hex') or '888888'),
                'rest_g': (s.get('remaining_weight') or 0) | round(1),
                'verbraucht_g': ([w - (s.get('remaining_weight') or w), 0] | max | round(1)) if w else ((s.get('used_weight') or 0) | round(1)),
                'gewicht_g': w,
                'eur_pro_g': ((p / w) | round(4)) if (p and w) else none,
                'ort': ort,
                'standort': so,
                'drucker': d.name if d else none
              }] %}
            {% endfor %}
            {{ ns.l }}
          kopf: >-
            {% set ns = namespace(m={}) %}
            {% if fb is defined and fb.status == 200 and fb.content is mapping %}
              {% set maps = (fb.content.get('toolhead_mappings') or {}).values() | list %}
              {% if maps | count > 0 %}
                {% set ns.m = maps[0] %}
              {% endif %}
            {% endif %}
            {{ {'1': (ns.m.get('0') or {}).get('spool_id', 0),
                '2': (ns.m.get('1') or {}).get('spool_id', 0)} }}
    sensor:
      - name: FilaMan Spulen
        unique_id: fabrication_filaman_spulen
        icon: mdi:printer-3d-nozzle-outline
        unit_of_measurement: Spulen
        state: "{{ spulen | count if ok else this.state }}"
        attributes:
          spulen: "{{ spulen if ok else this.attributes.get('spulen', []) }}"
          gesamt_rest_g: >-
            {{ (spulen | map(attribute='rest_g') | sum | round(0)) if ok
               else this.attributes.get('gesamt_rest_g') }}
          lagerwert_eur: >-
            {% if ok %}
              {% set ns = namespace(e=0) %}
              {% for s in spulen %}{% set ns.e = ns.e + s.rest_g * (s.eur_pro_g or 0) %}{% endfor %}
              {{ ns.e | round(2) }}
            {% else %}{{ this.attributes.get('lagerwert_eur') }}{% endif %}
          # Liste je Standort: name, rest_g, wert_eur, regal (Anzahl), drucker [[name, belegt, slots]]
          standorte: >-
            {% if ok %}
              {% set ns = namespace(l=[]) %}
              {% for so in standort_liste + (['ohne Ort'] if spulen | selectattr('standort', 'eq', 'ohne Ort') | list | count else []) %}
                {% set sp = spulen | selectattr('standort', 'eq', so) | list %}
                {% set w = namespace(e=0) %}
                {% for s in sp %}{% set w.e = w.e + s.rest_g * (s.eur_pro_g or 0) %}{% endfor %}
                {% set dl = namespace(l=[]) %}
                {% for d in drucker | selectattr('standort', 'eq', so) %}
                  {% set dl.l = dl.l + [[d.name, sp | selectattr('drucker', 'eq', d.name) | list | count, d.slots]] %}
                {% endfor %}
                {% set ns.l = ns.l + [{
                  'name': so,
                  'rest_g': sp | map(attribute='rest_g') | sum | round(0),
                  'wert_eur': w.e | round(2),
                  'spulen': sp | count,
                  'regal': sp | selectattr('drucker', 'none') | list | count,
                  'drucker': dl.l
                }] %}
              {% endfor %}
              {{ ns.l }}
            {% else %}{{ this.attributes.get('standorte', []) }}{% endif %}
          # Bestand je Filament (Hersteller + Name + Material) über alle Standorte
          bestand: >-
            {% if ok %}
              {% set ns = namespace(l=[]) %}
              {% set seen = namespace(k=[]) %}
              {% for s in spulen %}
                {% set k = s.hersteller ~ '|' ~ s.name ~ '|' ~ s.material %}
                {% if k not in seen.k %}
                  {% set seen.k = seen.k + [k] %}
                  {% set gl = spulen | selectattr('hersteller', 'eq', s.hersteller)
                                     | selectattr('name', 'eq', s.name)
                                     | selectattr('material', 'eq', s.material) | list %}
                  {% set je = namespace(l=[]) %}
                  {% for so in standort_liste + ['ohne Ort'] %}
                    {% set je.l = je.l + [[so, gl | selectattr('standort', 'eq', so) | map(attribute='rest_g') | sum | round(0)]] %}
                  {% endfor %}
                  {% set ns.l = ns.l + [{
                    'filament': (s.hersteller ~ ' ' ~ s.name) | trim,
                    'material': s.material,
                    'farbe': s.farbe,
                    'je_standort': je.l,
                    'summe_g': gl | map(attribute='rest_g') | sum | round(0)
                  }] %}
                {% endif %}
              {% endfor %}
              {{ ns.l | sort(attribute='summe_g', reverse=true) }}
            {% else %}{{ this.attributes.get('bestand', []) }}{% endif %}
          nachkauf: >-
            {% if ok %}
              {{ this.attributes.get('bestand', []) | selectattr('summe_g', 'lt', schwelle_g)
                 | map(attribute='filament') | list }}
            {% else %}{{ this.attributes.get('nachkauf', []) }}{% endif %}
          schwelle_g: "{{ schwelle_g }}"

      # Zähler für utility_meter (Monat): Summe aller je verbrauchten Gramm
      # (Anfangsgewicht − Rest; FilaMan meldet used_weight ohne Leerspulengewicht als 0),
      # inklusive archivierter Spulen, damit Archivieren den Zähler nicht senkt.
      - name: FilaMan Verbrauch gesamt
        unique_id: fabrication_filaman_verbrauch_gesamt
        icon: mdi:counter
        unit_of_measurement: g
        device_class: weight
        state_class: total_increasing
        state: >-
          {% if ok %}
            {% set ns = namespace(g=0) %}
            {% for s in alle %}
              {% set f = s.get('filament', {}) %}
              {% set w = s.get('initial_weight') or f.get('weight') or 0 %}
              {% set ns.g = ns.g + (([w - (s.get('remaining_weight') or w), 0] | max) if w else (s.get('used_weight') or 0)) %}
            {% endfor %}
            {{ ns.g | round(1) }}
          {% else %}{{ this.state }}{% endif %}

      - name: FilaMan Verbrauchskosten gesamt
        unique_id: fabrication_filaman_verbrauchskosten_gesamt
        icon: mdi:cash
        unit_of_measurement: EUR
        device_class: monetary
        state_class: total
        state: >-
          {% if ok %}
            {% set ns = namespace(e=0) %}
            {% for s in alle %}
              {% set f = s.get('filament', {}) %}
              {% set w = s.get('initial_weight') or f.get('weight') or 0 %}
              {% set p = s.get('price') if s.get('price') is not none else f.get('price') %}
              {% if p and w %}{% set ns.e = ns.e + ([w - (s.get('remaining_weight') or w), 0] | max) * p / w %}{% endif %}
            {% endfor %}
            {{ ns.e | round(2) }}
          {% else %}{{ this.state }}{% endif %}

      - name: Prusa XL Kopf 1 Spule
        unique_id: fabrication_prusa_xl_kopf_1_spule
        icon: mdi:numeric-1-circle-outline
        state: >-
          {% set s = spulen | selectattr('id', 'eq', kopf['1']) | first | default(none) %}
          {{ (s.hersteller ~ ' ' ~ s.name) if s else ('leer' if ok else this.state) }}
        attributes:
          spule_id: "{{ kopf['1'] }}"
          spule: "{{ spulen | selectattr('id', 'eq', kopf['1']) | first | default(none) }}"

      - name: Prusa XL Kopf 2 Spule
        unique_id: fabrication_prusa_xl_kopf_2_spule
        icon: mdi:numeric-2-circle-outline
        state: >-
          {% set s = spulen | selectattr('id', 'eq', kopf['2']) | first | default(none) %}
          {{ (s.hersteller ~ ' ' ~ s.name) if s else ('leer' if ok else this.state) }}
        attributes:
          spule_id: "{{ kopf['2'] }}"
          spule: "{{ spulen | selectattr('id', 'eq', kopf['2']) | first | default(none) }}"

      # Filamentkosten des laufenden/letzten Prusa-XL-Drucks: Verbrauchsdifferenz
      # der im Prusa XL geladenen Spulen seit Druckstart × €/g. FilaBridge bucht am
      # Druckende, also steht der Wert erst nach dem Druck.
      - name: Prusa XL Druck Filamentkosten
        unique_id: fabrication_prusa_xl_druck_filamentkosten
        icon: mdi:printer-3d-nozzle
        unit_of_measurement: EUR
        device_class: monetary
        state: >-
          {% if not ok %}{{ this.state }}
          {% elif trigger.id == 'druckstart' %}0
          {% else %}
            {% set base = this.attributes.get('basis', []) %}
            {% set ns = namespace(eur=0) %}
            {% for s in spulen | selectattr('drucker', 'eq', 'Prusa XL') %}
              {% set b = base | selectattr('0', 'eq', s.id) | map(attribute='1') | first | default(s.verbraucht_g) %}
              {% set ns.eur = ns.eur + ([s.verbraucht_g - b, 0] | max) * (s.eur_pro_g or 0) %}
            {% endfor %}
            {{ ns.eur | round(2) }}
          {% endif %}
        attributes:
          basis: >-
            {% if ok and (trigger.id == 'druckstart' or this.attributes.get('basis') is none) %}
              {% set ns = namespace(l=[]) %}
              {% for s in spulen %}{% set ns.l = ns.l + [[s.id, s.verbraucht_g]] %}{% endfor %}
              {{ ns.l }}
            {% else %}{{ this.attributes.get('basis', []) }}{% endif %}
          gramm: >-
            {% if not ok %}{{ this.attributes.get('gramm', 0) }}
            {% elif trigger.id == 'druckstart' %}0
            {% else %}
              {% set base = this.attributes.get('basis', []) %}
              {% set ns = namespace(g=0) %}
              {% for s in spulen | selectattr('drucker', 'eq', 'Prusa XL') %}
                {% set b = base | selectattr('0', 'eq', s.id) | map(attribute='1') | first | default(s.verbraucht_g) %}
                {% set ns.g = ns.g + ([s.verbraucht_g - b, 0] | max) %}
              {% endfor %}
              {{ ns.g | round(1) }}
            {% endif %}

  # ---------------------------------------------------------------------------
  # Druckhistorie aller Drucker (neueste zuerst, max. 50 Einträge).
  # Start: merkt Datei und Startzeit (Dateiname ist am Druckende schon weg).
  # Ende: 3 min nach finished/stopped, damit FilaBridge gebucht und der
  # FilaMan-Abruf (finished + 1 min) die Filamentkosten aktualisiert hat.
  # Nachtragen/Korrigieren: Event fabrication_druck_import mit data.drucke
  # (Liste von Einträgen im selben Format; gleiche ende-Zeit ersetzt).
  # Neuer Drucker: Trigger-Paar mit eigener id-Endung und Eintrag in quellen.
  - triggers:
      - trigger: state
        entity_id: sensor.prusa_xl
        to: printing
        not_from: [paused, attention, unavailable, unknown]
        for: "00:00:30"
        id: start|Prusa XL
      - trigger: state
        entity_id: sensor.prusa_xl
        to: [finished, stopped]
        for: "00:03:00"
        id: ende|Prusa XL
      - trigger: event
        event_type: fabrication_druck_import
        id: import|
    actions:
      - variables:
          quellen:
            Prusa XL:
              datei: sensor.prusa_xl_dateiname
              start: sensor.prusa_xl_druckstart
              energie: sensor.prusa_xl_druck_energie
              strom: sensor.prusa_xl_druck_stromkosten
              filament: sensor.prusa_xl_druck_filamentkosten
          max_eintraege: 50
          art: "{{ trigger.id.split('|')[0] }}"
          drucker: "{{ trigger.id.split('|')[1] }}"
          alt: "{{ state_attr('sensor.druck_historie', 'drucke') or [] }}"
          laufend_alt: "{{ state_attr('sensor.druck_historie', 'laufend') or [] }}"
          summe_alt: "{{ state_attr('sensor.druck_historie', 'summe') or {'anzahl': 0, 'eur': 0} }}"
          neu: >-
            {% if art == 'ende' %}
              {% set q = quellen[drucker] %}
              {% set l = laufend_alt | selectattr('drucker', 'eq', drucker) | first | default({}) %}
              {% set en = trigger.to_state.last_changed | as_local %}
              {% set st = as_datetime(l.get('start') or states(q.start)) %}
              {% set datei = l.get('datei') or states(q.datei) %}
              {% set datei = '' if datei in ['unavailable', 'unknown'] else datei %}
              {% set strom = states(q.strom) | float(0) %}
              {% set fil = states(q.filament) | float(0) %}
              {{ [{
                'drucker': drucker,
                'name': datei | regex_replace('\.(bgcode|gcode|3mf)$', '') | regex_replace('_?\d\.\dn_.*$', '') | replace('_', ' '),
                'datei': datei,
                'start': st.isoformat() if st else none,
                'ende': en.isoformat(),
                'min': ((en - st).total_seconds() / 60) | round(0) | int if st else none,
                'status': 'fertig' if trigger.to_state.state == 'finished' else 'abgebrochen',
                'kwh': states(q.energie) | float(0) | round(3),
                'strom': strom | round(2),
                'g': state_attr(q.filament, 'gramm') | float(0) | round(1),
                'filament': fil | round(2),
                'gesamt': (strom + fil) | round(2)
              }] }}
            {% elif art == 'import' %}
              {{ trigger.event.data.get('drucke', []) }}
            {% else %}[]{% endif %}
          ersetzt: "{{ neu | map(attribute='ende') | list }}"
          weg: "{{ alt | selectattr('ende', 'in', ersetzt) | list }}"
          summe_neu: >-
            {{ {'anzahl': summe_alt.anzahl + (neu | count) - (weg | count),
                'eur': (summe_alt.eur
                        + (neu | map(attribute='gesamt') | map('float', 0) | sum)
                        - (weg | map(attribute='gesamt') | map('float', 0) | sum)) | round(2),
                'g': (summe_alt.get('g', 0)
                      + (neu | map(attribute='g') | map('float', 0) | sum)
                      - (weg | map(attribute='g') | map('float', 0) | sum)) | round(1)} }}
    sensor:
      - name: Druck Historie
        unique_id: fabrication_druck_historie
        icon: mdi:history
        unit_of_measurement: Drucke
        state: "{{ summe_neu.anzahl }}"
        attributes:
          drucke: >-
            {{ ((neu + (alt | rejectattr('ende', 'in', ersetzt) | list))
                | sort(attribute='ende', reverse=true) | list)[:max_eintraege] }}
          laufend: >-
            {% set rest = laufend_alt | rejectattr('drucker', 'eq', drucker) | list %}
            {% if art == 'start' %}
              {% set q = quellen[drucker] %}
              {{ rest + [{'drucker': drucker,
                          'datei': states(q.datei),
                          'start': (trigger.to_state.last_changed | as_local).isoformat()}] }}
            {% elif art == 'ende' %}{{ rest }}{% else %}{{ laufend_alt }}{% endif %}
          # Laufende Summe seit Beginn (bleibt, auch wenn alte Einträge rausfallen).
          summe: "{{ summe_neu }}"
