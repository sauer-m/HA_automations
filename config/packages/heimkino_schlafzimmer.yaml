# Home-Assistant-Package: Heimkino Schlafzimmer
# Installation: /config/packages/heimkino_schlafzimmer.yaml

input_boolean:
  heimkino_schlafzimmer_aktiv:
    name: Heimkino Schlafzimmer aktiv
    icon: mdi:projector-screen
  heimkino_schlafzimmer_nachttisch_automatik:
    name: Nachttischlampe Heimkino-Automatik
    icon: mdi:lightbulb-auto
  heimkino_schlafzimmer_nachttisch_aktion:
    name: Nachttischlampe wird durch Heimkino gesteuert
    icon: mdi:cog-sync

template:
  - switch:
      - name: Heimkino Schlafzimmer
        unique_id: heimkino_schlafzimmer_schalter
        icon: mdi:bed-king-outline
        state: "{{ is_state('input_boolean.heimkino_schlafzimmer_aktiv', 'on') }}"
        availability: >-
          {{ states('button.xgimi_halo_remote_xgimi_projector_wakeup')
               not in ['unknown', 'unavailable'] }}
        turn_on:
          - action: script.heimkino_schlafzimmer_einschalten
        turn_off:
          - action: script.heimkino_schlafzimmer_ausschalten

script:
  heimkino_schlafzimmer_xgimi_hdmi:
    alias: XGIMI Schlafzimmer auf HDMI schalten
    description: Oeffnet das echte XGIMI-Eingangsmenue und bestaetigt HDMI.
    icon: mdi:video-input-hdmi
    mode: restart
    sequence:
      - repeat:
          sequence:
            - action: androidtv.adb_command
              continue_on_error: true
              target:
                entity_id: media_player.schlafzimmer_xgimi_halo_adb
              data:
                command: >-
                  am start -n com.xgimi.misckey/.MainActivity
                  -a com.android.tv.action.VIEW_INPUTS
            - delay:
                milliseconds: 500
            - action: androidtv.adb_command
              continue_on_error: true
              target:
                entity_id: media_player.schlafzimmer_xgimi_halo_adb
              data:
                command: input keyevent 23
            - delay:
                seconds: 8
          until:
            - condition: template
              value_template: "{{ repeat.index >= 2 }}"

  heimkino_schlafzimmer_nachttisch_setzen:
    alias: Heimkino Schlafzimmer Nachttischlampe setzen
    description: Setzt die Lampe und kennzeichnet die Änderung als Automatikaktion.
    mode: queued
    max: 5
    fields:
      ziel:
        required: true
        selector:
          select:
            options:
              - "on"
              - "off"
      helligkeit:
        required: false
        selector:
          number:
            min: 1
            max: 100
    sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_aktion
      - choose:
          - conditions: "{{ ziel == 'on' }}"
            sequence:
              - action: light.turn_on
                target:
                  entity_id: light.nachttischlampe
                data:
                  brightness_pct: "{{ helligkeit | int(1) }}"
        default:
          - action: light.turn_off
            target:
              entity_id: light.nachttischlampe
      # Einige Leuchten melden ihren neuen Zustand leicht verzögert zurück.
      - delay:
          seconds: 2
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_aktion

  heimkino_schlafzimmer_firetv_wecken:
    alias: Heimkino Schlafzimmer Fire TV wecken
    description: Weckt den Fire TV Stick und wechselt ins Hauptmenü.
    icon: mdi:television-play
    mode: restart
    sequence:
      - repeat:
          sequence:
            - action: androidtv.adb_command
              continue_on_error: true
              target:
                entity_id: media_player.schlafzimmer_fire_tv_stick
              data:
                command: WAKEUP
            - delay:
                seconds: 2
            - action: androidtv.adb_command
              continue_on_error: true
              target:
                entity_id: media_player.schlafzimmer_fire_tv_stick
              data:
                command: HOME
            - delay:
                seconds: 3
          until:
            - condition: template
              value_template: >-
                {{ states('media_player.schlafzimmer_fire_tv_stick')
                     not in ['off', 'standby', 'unknown', 'unavailable']
                   or repeat.index >= 3 }}

  heimkino_schlafzimmer_einschalten:
    alias: Heimkino Schlafzimmer einschalten
    description: Startet XGIMI und Fire TV und schaltet den XGIMI auf HDMI.
    icon: mdi:projector-screen
    mode: single
    sequence:
      # Rollo, Hauptlicht und Nachttischlampe getrennt zwischenspeichern.
      - action: scene.create
        data:
          scene_id: heimkino_schlafzimmer_vorher
          snapshot_entities:
            - cover.rollo_schlafzimmer
            - light.schlafzimmerlicht
      - action: scene.create
        data:
          scene_id: heimkino_schlafzimmer_nachttisch_vorher
          snapshot_entities:
            - light.nachttischlampe

      # 100 % ist vollstaendig geoeffnet und 0 % vollstaendig geschlossen.
      # Liegt die Position ueber 20 %, auf 20 % schliessen. Positionen bei
      # oder unter 20 % bleiben unveraendert.
      - if:
          - condition: template
            value_template: >-
              {{ state_attr('cover.rollo_schlafzimmer', 'current_position')
                   | float(-1) > 20 }}
        then:
          - action: cover.set_cover_position
            target:
              entity_id: cover.rollo_schlafzimmer
            data:
              position: 20

      # Zuerst ein aktives HDMI-Signal bereitstellen. So sieht der XGIMI den
      # Fire TV bereits während seines Starts und beim späteren HDMI-Wechsel.
      - action: script.heimkino_schlafzimmer_firetv_wecken

      # XGIMI einschalten. Der Wakeup-Button funktioniert auch dann, wenn ADB
      # während des ausgeschalteten Zustands noch nicht erreichbar ist.
      - repeat:
          sequence:
            - action: button.press
              continue_on_error: true
              target:
                entity_id: button.xgimi_halo_remote_xgimi_projector_wakeup
            - wait_template: >-
                {{ states('media_player.schlafzimmer_xgimi_halo_adb')
                     not in ['off', 'unknown', 'unavailable'] }}
              timeout: "00:00:20"
              continue_on_timeout: true
          until:
            - condition: template
              value_template: >-
                {{ states('media_player.schlafzimmer_xgimi_halo_adb')
                     not in ['off', 'unknown', 'unavailable']
                   or repeat.index >= 3 }}

      # HOME nach dem Projektorstart nochmals senden. Dadurch wird der Fire TV
      # nach einem möglichen HDMI-/HDCP-Neuaufbau erneut als aktive Quelle
      # bestätigt, bevor der XGIMI auf HDMI schaltet.
      - action: androidtv.adb_command
        continue_on_error: true
        target:
          entity_id: media_player.schlafzimmer_fire_tv_stick
        data:
          command: WAKEUP
      - delay:
          seconds: 1
      - action: androidtv.adb_command
        continue_on_error: true
        target:
          entity_id: media_player.schlafzimmer_fire_tv_stick
        data:
          command: HOME
      - delay:
          seconds: 3

      # Derselbe getestete HDMI-Ablauf wird auch vom Fernbedienungsbutton
      # verwendet, damit Automation und Dashboard nicht auseinanderlaufen.
      - action: script.heimkino_schlafzimmer_xgimi_hdmi

      - if:
          - condition: template
            value_template: >-
              {{ states('media_player.schlafzimmer_xgimi_halo_adb')
                   not in ['off', 'unknown', 'unavailable']
                 and states('media_player.schlafzimmer_fire_tv_stick')
                   not in ['off', 'standby', 'unknown', 'unavailable'] }}
        then:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.heimkino_schlafzimmer_aktiv
          # Beleuchtung immer zuletzt schalten, nachdem Fire TV, Projektor und
          # HDMI-Umschaltung vollständig abgearbeitet wurden.
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_automatik
          - action: script.heimkino_schlafzimmer_nachttisch_setzen
            data:
              ziel: "on"
              helligkeit: 1
          # Das Hauptlicht erst ausschalten, nachdem die Nachttischlampe
          # eingeschaltet und ihr neuer Zustand zurueckgemeldet wurde.
          - action: light.turn_off
            target:
              entity_id: light.schlafzimmerlicht
            data:
              transition: 5
          # Falls der Film bereits läuft, muss nicht erst auf den nächsten
          # Zustandswechsel des Players gewartet werden.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('media_player.fire_tv_stick', 'playing')
                     or is_state('media_player.schlafzimmer_fire_tv_stick', 'playing') }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.rollo_schlafzimmer
                data:
                  position: 0
              - action: script.heimkino_schlafzimmer_nachttisch_setzen
                data:
                  ziel: "off"
        else:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heimkino_schlafzimmer_aktiv
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_automatik
          - action: scene.turn_on
            continue_on_error: true
            target:
              entity_id: scene.heimkino_schlafzimmer_vorher
          - action: scene.turn_on
            continue_on_error: true
            target:
              entity_id: scene.heimkino_schlafzimmer_nachttisch_vorher
          - action: persistent_notification.create
            data:
              notification_id: heimkino_schlafzimmer_startfehler
              title: Heimkino Schlafzimmer nicht vollständig gestartet
              message: >-
                XGIMI: {{ states('media_player.schlafzimmer_xgimi_halo_adb') }},
                Fire TV: {{ states('media_player.schlafzimmer_fire_tv_stick') }}.
                Bitte ADB-Verbindungen und Gerätezustände prüfen.

  heimkino_schlafzimmer_ausschalten:
    alias: Heimkino Schlafzimmer ausschalten
    description: Versetzt Fire TV und XGIMI in den Standby.
    icon: mdi:power-off
    mode: single
    sequence:
      # Nachttischlampe eine Minute als Ausstiegslicht verwenden; ihr zuvor
      # gespeicherter Zustand wird erst danach wiederhergestellt.
      - action: script.heimkino_schlafzimmer_nachttisch_setzen
        data:
          ziel: "on"
          helligkeit: 10
      - parallel:
          - sequence:
              - action: androidtv.adb_command
                continue_on_error: true
                target:
                  entity_id: media_player.schlafzimmer_fire_tv_stick
                data:
                  command: SLEEP
              - delay:
                  seconds: 2
              - action: remote.send_command
                continue_on_error: true
                target:
                  entity_id: remote.xgimi_halo
                data:
                  command: POWER
              - action: input_boolean.turn_off
                target:
                  entity_id:
                    - input_boolean.heimkino_schlafzimmer_aktiv
                    - input_boolean.heimkino_schlafzimmer_nachttisch_automatik
                    - input_boolean.heimkino_schlafzimmer_nachttisch_aktion
              - action: scene.turn_on
                continue_on_error: true
                target:
                  entity_id: scene.heimkino_schlafzimmer_vorher
                data:
                  transition: 5
              - action: persistent_notification.dismiss
                continue_on_error: true
                data:
                  notification_id: heimkino_schlafzimmer_startfehler
          - sequence:
              - delay:
                  minutes: 1
              # Nicht in eine inzwischen neu gestartete Heimkino-Sitzung
              # eingreifen.
              - condition: state
                entity_id: input_boolean.heimkino_schlafzimmer_aktiv
                state: "off"
              - action: scene.turn_on
                continue_on_error: true
                target:
                  entity_id: scene.heimkino_schlafzimmer_nachttisch_vorher

automation:
  - id: heimkino_schlafzimmer_nachttisch_medienstatus
    alias: Heimkino Schlafzimmer – Nachttischlampe bei Wiedergabe
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - media_player.fire_tv_stick
          - media_player.schlafzimmer_fire_tv_stick
        to: playing
      - trigger: state
        entity_id:
          - media_player.fire_tv_stick
          - media_player.schlafzimmer_fire_tv_stick
        to: paused
    conditions:
      - condition: state
        entity_id: input_boolean.heimkino_schlafzimmer_aktiv
        state: "on"
      - condition: state
        entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_automatik
        state: "on"
    actions:
      - choose:
          - conditions: >-
              {{ is_state('media_player.fire_tv_stick', 'playing')
                 or is_state('media_player.schlafzimmer_fire_tv_stick', 'playing') }}
            sequence:
              - action: script.heimkino_schlafzimmer_nachttisch_setzen
                data:
                  ziel: "off"
          - conditions: >-
              {{ not is_state('media_player.fire_tv_stick', 'playing')
                 and not is_state('media_player.schlafzimmer_fire_tv_stick', 'playing')
                 and (is_state('media_player.fire_tv_stick', 'paused')
                      or is_state('media_player.schlafzimmer_fire_tv_stick', 'paused')) }}
            sequence:
              - action: script.heimkino_schlafzimmer_nachttisch_setzen
                data:
                  ziel: "on"
                  helligkeit: 5

  - id: heimkino_schlafzimmer_rollo_filmbeginn
    alias: Heimkino Schlafzimmer - Rollo bei Filmbeginn schliessen
    description: Schliesst das Rollo bei Wiedergabebeginn vollstaendig.
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - media_player.fire_tv_stick
          - media_player.schlafzimmer_fire_tv_stick
        to: playing
    conditions:
      - condition: state
        entity_id: input_boolean.heimkino_schlafzimmer_aktiv
        state: "on"
    actions:
      - action: cover.set_cover_position
        target:
          entity_id: cover.rollo_schlafzimmer
        data:
          position: 0

  - id: heimkino_schlafzimmer_nachttisch_manuell
    alias: Heimkino Schlafzimmer – manuelle Nachttischlampe priorisieren
    description: Deaktiviert die Filmlicht-Automatik nach einer externen Änderung.
    mode: restart
    triggers:
      - trigger: state
        entity_id: light.nachttischlampe
    conditions:
      - condition: state
        entity_id: input_boolean.heimkino_schlafzimmer_aktiv
        state: "on"
      - condition: state
        entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_automatik
        state: "on"
      - condition: state
        entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_aktion
        state: "off"
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable'] }}"
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.heimkino_schlafzimmer_nachttisch_automatik
      - action: persistent_notification.create
        data:
          notification_id: heimkino_schlafzimmer_nachttisch_manuell
          title: Nachttischlampe manuell übernommen
          message: >-
            Die automatische Dimmung bei Wiedergabe und Pause ist bis zum
            nächsten Start von Heimkino Schlafzimmer deaktiviert.
