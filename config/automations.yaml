      - event.echo_dot_badezimmer_sprachereignis
      - event.echo_dot_keller_sprachereignis
      - event.echo_spot_schlafzimmer_sprachereignis
      - event.echo_pop_hr_sprachereignis
      - event.echo_pop_l_sprachereignis
      - event.echo_pop_r_sprachereignis
      - event.fire_tv_cube_sprachereignis
    options:
