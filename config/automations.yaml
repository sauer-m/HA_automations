      - triggered
  conditions:
  - condition: template
    value_template: '{{ (state_attr(trigger.entity_id, ''voice_command'') | default('''',
      true) | lower) is search(''mission|mondm|mond\\s+s?m(ä|a)u|s?m(ä|a|o)u?s+h?ion|m(u|ü)nzmeister'')
      }}'
    note: 'Alexa schreibt das Wort unterschiedlich. Erkannt (Stand 16.11.): mondmission,
      mission, wohnzimmermission, mondmäuschen, smoshion, munzmeister, mondsmäussion'
  actions:
  - action: script.mondsmaussion_ansagen
    data:
      ziel: '{{ [trigger.entity_id | replace(''event.'', ''notify.'') | replace(''_sprachereignis'',
        ''_sprechen'')] }}'
    note: Antwort auf dem Echo, der gefragt wurde
  mode: parallel
- id: fabrication_filaman_ams_a1_mini
