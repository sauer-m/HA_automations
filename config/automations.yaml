- id: '1794090985861'
  alias: 'Haushaltsgeräte fertig: Alexa-Ansage'
  description: Ansage auf 5 Echos, wenn WashData das Ende von Waschmaschine, Trockner
    oder Spülmaschine meldet. Ruhezeit 21:00–07:00 (Marcel, 07.11.2026); Push kommt
    unabhängig davon von WashData selbst.
  triggers:
  - trigger: state
    entity_id: sensor.waschmaschine_zustand
    to: finished
    variables:
      meldung: Die Waschmaschine ist fertig
  - trigger: state
    entity_id: sensor.trockner_zustand
    to: finished
    variables:
      meldung: Der Trockner ist fertig
  - trigger: state
    entity_id: sensor.spulmaschine_zustand
    to: finished
    variables:
      meldung: Die Spülmaschine ist fertig
  conditions:
  - condition: time
    after: 07:00:00
    before: '21:00:00'
    note: Ruhezeit laut Marcel 21–7 Uhr
  actions:
  - action: notify.send_message
    target:
      entity_id:
      - notify.echo_dot_badezimmer_sprechen
      - notify.echo_show_kuche_sprechen
      - notify.fire_tv_cube_sprechen
      - notify.echo_dot_esszimmer_sprechen
      - notify.echo_dot_keller_sprechen
    data:
      message: '{{ meldung }}'
    continue_on_error: true
    note: Gleiche Räume wie die früheren alexa_media-Ansagen
  mode: parallel
- id: '1794096366871'
  alias: 'Haushalt: tägliche Erinnerung'
  description: Jeden Morgen um 9 Uhr Push an Marcel mit allen heute fälligen und überfälligen
    Aufgaben der Home-Tasks-Liste „Haushalt“. Aufgaben mit dem Tag „saison“ werden
    von November bis März auf den 1. April verschoben statt gemeldet (Marcel, 08.11.2026).
    Seit 25.11.2026 auch die Liste „Körperpflege“ (todo.korperpflege).
  triggers:
  - trigger: time
    at: 09:00:00
  actions:
  - action: home_tasks.get_tasks
    data:
      list_name: Haushalt
      due: today_or_overdue
    response_variable: faellig
  - action: home_tasks.get_tasks
    data:
      list_name: Körperpflege
      due: today_or_overdue
    response_variable: pflege
  - variables:
      winterpause: '{{ now().month in [11, 12, 1, 2, 3] }}'
      saisonstart: '{{ (now().year + (1 if now().month > 3 else 0)) ~ ''-04-01'' }}'
      pausieren: '{{ (faellig.tasks | selectattr(''tags'', ''contains'', ''saison'')
        | list) if winterpause else [] }}'
      melden: '{{ ((faellig.tasks | rejectattr(''tags'', ''contains'', ''saison'')
        | list) if winterpause else faellig.tasks) + pflege.tasks }}'
  - repeat:
      for_each: '{{ pausieren }}'
      sequence:
      - action: home_tasks.update_task
        data:
          list_name: Haushalt
          task_id: '{{ repeat.item.id }}'
          due_date: '{{ saisonstart }}'
    note: Saisonaufgaben (Garten, Terrasse, Mähroboter) im Winter auf den Saisonstart
      schieben
  - condition: template
    value_template: '{{ melden | count > 0 }}'
  - action: notify.mobile_app_sm_f741b
    data:
      title: 'Heute fällig: {{ melden | count }} {{ ''Aufgabe'' if melden | count
        == 1 else ''Aufgaben'' }}'
      message: '{% for t in melden %}• {{ t.title }}{% if t.due_date and t.due_date
        < now().date() | string %} (seit {{ as_datetime(t.due_date).strftime(''%d.%m.'')
        }}){% endif %}

        {% endfor %}'
      data:
        tag: haushalt-faellig
        clickAction: /dashboard-haushalt/aufgaben
  mode: single
- id: '1794305831938'
  alias: Prusa XL - Druckenergie bei Druckstart zurücksetzen
  description: Setzt sensor.prusa_xl_druck_energie bei jedem neuen Druck auf 0. Fortsetzen
    nach Pause oder Rückkehr aus unavailable zählt nicht als neuer Druck. Basis für
    Kosten pro Druck (Fabrication-Karte).
  triggers:
  - trigger: state
    entity_id: sensor.prusa_xl
    to: printing
    not_from:
    - paused
    - attention
    - unavailable
    - unknown
  conditions: []
  actions:
  - action: utility_meter.calibrate
    target:
      entity_id: sensor.prusa_xl_druck_energie
    data:
      value: '0'
  mode: single
- id: '1794305839828'
  alias: 'Pflanzen: Gießerinnerung'
  description: 'Jeden Morgen um 9 Uhr Push an Marcel mit allen Pflanzen, die Wasser
    brauchen: Plant-Monitor-Pflanzen (Sensor, Bodenfeuchte unter Minimum) und Simple-Plant-Pflanzen
    (Gießplan fällig). Iteriert über states.plant und binary_sensor.simple_plant_todo_*,
    damit neue Pflanzen automatisch dabei sind. Hydrokultur-Pflanzen (Modell enthält
    ''Hydrokultur'') werden als ''Wasserstand prüfen'' gemeldet (Marcel, 10.11./15.11.2026).'
  triggers:
  - trigger: time
    at: 09:00:00
  actions:
  - variables:
      durstig: '{{ states.plant | selectattr(''attributes.moisture_status'', ''defined'')
        | selectattr(''attributes.moisture_status'', ''eq'', ''Low'') | list }}'
      giessen: '{{ states.binary_sensor | selectattr(''entity_id'', ''match'', ''binary_sensor\.simple_plant_todo_'')
        | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'') | list
        }}'
      anzahl: '{{ (durstig | count) + (giessen | count) }}'
    note: Sensor-Pflanzen mit zu trockener Erde plus fällige Simple-Plant-Pflanzen
  - condition: template
    value_template: '{{ anzahl | int(0) > 0 }}'
    note: 'Template nötig: Die Pflanzenlisten sind dynamisch, kein natives Pendant'
  - action: notify.mobile_app_sm_f741b
    data:
      title: "\U0001F33F {{ anzahl }} {{ 'Pflanze braucht' if anzahl | int(0) == 1
        else 'Pflanzen brauchen' }} Wasser"
      message: '{% for p in durstig %}{% set m = p.attributes.problems | default([])
        | selectattr(''sensor_type'', ''eq'', ''moisture'') | first %}• {{ p.name
        }}{% if m %} ({{ m.current | float | round(0) | int }} %, min {{ m.min }}
        %){% endif %}

        {% endfor %}{% for e in giessen %}{% set d = device_id(e) %}• {{ device_attr(d,
        ''name'') }} ({{ area_name(e) or ''?'' }}){% if ''Hydrokultur'' in (device_attr(d,
        ''model'') or '''') %} – Wasserstand prüfen{% endif %}

        {% endfor %}'
      data:
        tag: pflanzen-giessen
        clickAction: /dashboard-pflanzen/pflanzen
  mode: single
- id: '1794740358663'
  alias: 'Mondsmäussion: Alexa-Frage beantworten'
  description: 'Wer einen Echo nach der Mondsmäussion fragt, bekommt die Antwort auf
    genau diesem Echo. Zuverlässigster Satz: ''Alexa, Mondmission''. Liest das Sprachereignis
    der Alexa-Devices-Integration. Angelegt 15.11.2026, Erkennung erweitert 16.11.2026.'
