- id: '1781716502903'
  alias: Bürolicht mit Präsenzmelder
  description: Präsenz im Büro -> Ambilight an, aber nur wenn jemand zu Hause ist
    (unabhängig von der Helligkeit). Keine Präsenz mehr -> aus. Hintergrund für die
    Bedingung und die gesenkte Melder-Empfindlichkeit (Bewegung 7, Stillstand 6, Reichweite
    4 m) waren Fehlalarme, während niemand zu Hause war.
  triggers:
  - trigger: state
    entity_id: binary_sensor.prasenzmelder_buro_presence
    to: 'on'
    id: presence_on
  - trigger: state
    entity_id:
    - binary_sensor.prasenzmelder_buro_presence
    to:
    - 'off'
    - unavailable
    - unknown
    id: presence_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_on
      - condition: template
        value_template: '{{ persons | select(''is_state'', ''home'') | list | count
          > 0 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ office_light }}'
        data:
          brightness_pct: 100
    - conditions:
      - condition: trigger
        id: presence_off
      sequence:
      - action: light.turn_off
        target:
          entity_id: '{{ office_light }}'
  mode: restart
  variables:
    office_light: light.ambilight_buro
    persons:
    - person.sauerm
    - person.sarah
- id: '1783672945400'
  alias: Präsenzmelder Badezimmer
  description: Präsenz im Bad -> Hintergrundbeleuchtung an, aber nur bei Dunkelheit
    (unter max_lux). Keine Präsenz mehr -> aus.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.prasenzmelder_badezimmer_presence
    to:
    - 'on'
    id: presence_on
  - trigger: state
    entity_id:
    - binary_sensor.prasenzmelder_badezimmer_presence
    to:
    - 'off'
    id: presence_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_on
      - condition: template
        value_template: '{{ states(illuminance_sensor) | float(0) < max_lux }}'
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 100
        target:
          entity_id: '{{ bath_light }}'
    - conditions:
      - condition: trigger
        id: presence_off
      sequence:
      - action: light.turn_off
        data: {}
        target:
          entity_id: '{{ bath_light }}'
  mode: restart
  variables:
    bath_light: light.badezimmerlicht_hintergrundbeleuchtung
    illuminance_sensor: sensor.prasenzmelder_badezimmer_illuminance
    max_lux: 50
