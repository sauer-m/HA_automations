        - GFB99
        - 240
        - 270
        - ABS
        ASA:
        - GFB98
        - 240
        - 270
        - ASA
        TPU:
        - GFU99
        - 200
        - 250
        - TPU
        PA:
        - GFN99
        - 260
        - 290
        - PA
        PC:
        - GFC99
        - 260
        - 290
        - PC
        PVA:
        - GFS99
        - 190
        - 240
        - PVA
        ESUN|PLA+:
        - GFL03
        - 205
        - 215
        - PLA
        ESUN|PLA:
        - GFL03
        - 205
        - 215
        - PLA
      todo: '{% set slots = [[''Slot 1'', p ~ ''ams_1_slot_1''], [''Slot 2'', p ~
        ''ams_1_slot_2''], [''Slot 3'', p ~ ''ams_1_slot_3''], [''Slot 4'', p ~ ''ams_1_slot_4''],
        [''Extern'', p ~ ''externalspool_externe_spule'']] %}{% set sp = state_attr(''sensor.filaman_spulen'',
        ''spulen'') or [] %}{% set ns = namespace(l=[]) %}{% for s in slots %}{% set
        f = sp | selectattr(''ort'', ''eq'', ''A1 Mini - '' ~ s[0]) | first | default(none)
        %}{% set a = states[s[1]].attributes if states[s[1]] is not none else {} %}{%
        set rfid = (a.get(''tag_uid'') or ''0000000000000000'') | replace(''0'', '''')
        != '''' %}{% set m = (profile.get(((f.hersteller if f else '''') | upper)
        ~ ''|'' ~ ((f.material if f else '''') | upper)) or profile.get((f.material
        if f else '''') | upper)) %}{% if f and m and not rfid and not a.get(''empty'',
        true) %}{% set farbe = (f.farbe | replace(''#'', '''') | upper)[:6] ~ ''FF''
        %}{% set ist = (a.get(''color'') or '''') | replace(''#'', '''') | upper %}{%
        if (a.get(''filament_id'') or '''') != m[0] or ist != farbe %}{% set ns.l
        = ns.l + [{''entity_id'': s[1], ''tray_info_idx'': m[0], ''tray_color'': farbe,
        ''tray_type'': m[3], ''nozzle_temp_min'': m[1], ''nozzle_temp_max'': m[2],
        ''spule'': f.hersteller ~ '' '' ~ f.name, ''slot'': s[0]}] %}{% endif %}{%
        endif %}{% endfor %}{{ ns.l }}'
    note: Slots mit FilaMan-Spule, die im AMS anders eingestellt sind
  - condition: template
    value_template: '{{ todo | count > 0 }}'
    note: Nichts zu tun, wenn alle Slots passen
  - repeat:
      for_each: '{{ todo }}'
      sequence:
      - action: bambu_lab.set_filament
        data:
          entity_id: '{{ repeat.item.entity_id }}'
          tray_info_idx: '{{ repeat.item.tray_info_idx }}'
          tray_color: '{{ repeat.item.tray_color }}'
          tray_type: '{{ repeat.item.tray_type }}'
          nozzle_temp_min: '{{ repeat.item.nozzle_temp_min }}'
          nozzle_temp_max: '{{ repeat.item.nozzle_temp_max }}'
        continue_on_error: true
      - action: logbook.log
        data:
          name: A1 Mini AMS
          message: '{{ repeat.item.slot }}: {{ repeat.item.spule }} ({{ repeat.item.tray_type
            }}) aus FilaMan gesetzt'
          entity_id: '{{ repeat.item.entity_id }}'
  mode: queued
  max: 3
- id: fabrication_drucker_benachrichtigungen
  alias: 'Fabrication: Druckerbenachrichtigungen'
  description: 'Bündelt die Meldungen aller Drucker auf Marcels Samsung (ersetzt die
    Prusa-Connect-App-Meldungen): Druck fertig oder abgebrochen mit Dauer, Gramm und
    Kosten aus der Druckhistorie, dazu sofortige Warnungen bei Pause, Aufmerksamkeit
    oder Fehler. Kamerabild als Anhang, Tipp öffnet die Druckeransicht.'
  triggers:
  - trigger: state
    entity_id: sensor.druck_historie
    id: fertig
    note: Neuer Eintrag in der Druckhistorie = Druck beendet, Kosten sind dann schon
      berechnet
  - trigger: state
    entity_id: sensor.prusa_xl
    to:
    - paused
    - attention
    - error
    not_from:
    - unavailable
    - unknown
    id: prusa_problem
  - trigger: state
    entity_id: sensor.a1mini_0309da442500462_druckstatus
    to: pause
    id: a1_problem
  - trigger: state
    entity_id:
    - binary_sensor.a1mini_0309da442500462_hms_fehler
    - binary_sensor.a1mini_0309da442500462_druckfehler
    from: 'off'
    to: 'on'
    id: a1_problem
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: fertig
      - condition: template
        value_template: '{{ i != {} and not letzter.get(''nachgetragen'', false) and
          (now() - as_datetime(letzter.ende)).total_seconds() < 900 }}'
        note: Nur echte, frische Druckenden; Importe und Korrekturen lösen nichts
          aus
      sequence:
      - action: notify.mobile_app_sm_f741b
        data:
          title: '{{ ''✅ '' ~ drucker ~ '': Druck fertig'' if letzter.status == ''fertig''
            else ''✕ '' ~ drucker ~ '': Druck abgebrochen'' }}'
          message: '{% macro eur(x) %}{{ (''%.2f'' | format(x | float(0))) | replace(''.'',
            '','') }} €{% endmacro %}{{ letzter.name or ''Unbenannter Druck'' }}

            {{ ''%d:%02d h'' | format((letzter.min or 0) // 60, (letzter.min or 0)
            % 60) if letzter.min is not none else '''' }}{{ '' · '' ~ (letzter.g |
            round(0) | int) ~ '' g'' if letzter.g }}{{ '' · '' ~ eur(letzter.gesamt)
            if letzter.gesamt else '''' }}{{ '' (ohne Filament)'' if letzter.filament
            is none and letzter.g }}'
          data:
            tag: '{{ tag }}'
            channel: 3D-Druck
            image: /api/camera_proxy/{{ i.kamera }}
            clickAction: '{{ i.pfad }}'
    - conditions:
      - condition: trigger
        id:
        - prusa_problem
        - a1_problem
      sequence:
      - variables:
          st: '{{ states(i.status) }}'
          titel: '{{ {''paused'': ''Druck pausiert'', ''pause'': ''Druck pausiert'',
            ''attention'': ''braucht Aufmerksamkeit'', ''error'': ''Fehler''}.get(st,
            ''Fehler'') if trigger.id == ''prusa_problem'' or trigger.entity_id ==
            i.status else (''HMS-Fehler'' if ''hms'' in trigger.entity_id else ''Druckfehler'')
            }}'
      - action: notify.mobile_app_sm_f741b
        data:
          title: '⚠️ {{ drucker }}: {{ titel }}'
          message: '{% set d = states(i.datei) %}{{ d if d not in [''unknown'', ''unavailable'',
            ''''] else ''Aktueller Druck'' }} · {{ states(i.fortschritt) | int(0)
            }} %

            Bitte am Drucker nachsehen.'
          data:
            tag: '{{ tag }}_problem'
            channel: 3D-Druck Alarm
            importance: high
            priority: high
            ttl: 0
            image: /api/camera_proxy/{{ i.kamera }}
            clickAction: '{{ i.pfad }}'
  mode: queued
  max: 5
  variables:
    info:
      Prusa XL:
        kamera: camera.tapo_c200c_prusa_xl_hd_stream
        pfad: /dashboard-fabrication/prusa-xl
        status: sensor.prusa_xl
        datei: sensor.prusa_xl_dateiname
        fortschritt: sensor.prusa_xl_fortschritt
      A1 Mini:
        kamera: camera.a1mini_0309da442500462_kamera
        pfad: /dashboard-fabrication/a1-mini
        status: sensor.a1mini_0309da442500462_druckstatus
        datei: sensor.a1mini_0309da442500462_name_der_aufgabe
        fortschritt: sensor.a1mini_0309da442500462_druckfortschritt
    letzter: '{{ (state_attr(''sensor.druck_historie'', ''drucke'') or [{}])[0] }}'
    drucker: '{{ letzter.get(''drucker'', '''') if trigger.id == ''fertig'' else (''Prusa
      XL'' if trigger.id == ''prusa_problem'' else ''A1 Mini'') }}'
    i: '{{ info.get(drucker, {}) }}'
    tag: druck_{{ drucker | lower | replace(' ', '_') }}
- id: '1794924745004'
  alias: 'NetOps: OMV-Meldung per Push'
  description: Empfängt kritische Meldungen des Backup-Servers OMV (.11) per Webhook
    (Prüfskript /usr/local/sbin/netops-omv-check, Cron alle 15 min) und sendet Push
    plus HA-Glocke. Ersetzt die OMV-Mails seit 17.11.2026. Angelegt von NetOps.
  triggers:
  - trigger: webhook
    webhook_id: !secret REDACTED_webhook_id  # im Repo geschwärzt
    allowed_methods:
    - POST
    local_only: true
    note: Webhook-ID liegt in C:\Users\Marcel\.config\omv\ha-webhook-id.txt und auf
      OMV in /root/.netops-webhook
  actions:
  - variables:
      titel: OMV {{ trigger.json.severity | default('WARNUNG') }}
      text: '{{ trigger.json.message | default(''Meldung ohne Text'') }}'
      thema: '{{ trigger.json.topic | default(''omv'') }}'
  - action: notify.mobile_app_sm_f741b
    data:
      title: '{{ titel }}'
      message: '{{ text }}'
      data:
        sticky: 'true'
        group: netops
        tag: netops-omv-{{ thema }}
  - action: persistent_notification.create
    data:
      title: '{{ titel }}'
      message: '{{ text }}'
      notification_id: netops_omv_{{ thema }}
  mode: queued
  max: 10
- id: '1794955606197'
  alias: Prusa XL - Steckdose nach Druckende aus
  description: Schaltet die Steckdose des Prusa XL aus, wenn der Drucker seit 30 Minuten
    nicht druckt und unter 30 W zieht. Spart ca. 14 W Leerlauf (rund 40 Euro im Jahr).
    Vor dem naechsten Druck die Steckdose wieder einschalten.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.prusa_xl_keller_leistung
    below: 30
    for:
      minutes: 30
  conditions:
  - condition: state
    entity_id: switch.prusa_xl_keller
    state: 'on'
  - condition: state
    entity_id: sensor.prusa_xl
    state:
    - finished
    - stopped
    - idle
    - ready
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.prusa_xl_keller
  mode: single
- id: '1795455237737'
  alias: 'Waage: Marcel an openScale sync'
  description: Schickt jede neue Messung aus input_number.marcel_gewicht (und Körperfett,
    wenn frisch gesetzt) retained an openScale sync auf Marcels Handy. Ein Topic pro
    Messung, damit Messungen erhalten bleiben, wenn das Handy nicht zu Hause ist.
    openScale sync importiert sie und exportiert nach Health Connect.
  triggers:
  - trigger: state
    entity_id: input_number.marcel_gewicht
    to:
    not_from:
    - unknown
    - unavailable
    note: 'to: null = nur Zustandswechsel, keine Attributänderungen; not_from verhindert
      Senden nach Neustart.'
  conditions: []
  actions:
  - variables:
      ts: '{{ (as_timestamp(trigger.to_state.last_changed) * 1000) | int }}'
      weight: '{{ trigger.to_state.state | float }}'
      fett: '{{ states(''input_number.marcel_koerperfett'') }}'
      fett_ok: '{{ is_number(fett) and fett | float > 3 and (now() - states.input_number.marcel_koerperfett.last_updated).total_seconds()
        < 600 }}'
    note: Körperfett zählt nur, wenn > Minimum (3 = Platzhalter) und in den letzten
      10 min gesetzt; die Filter-Automation setzt Körperfett vor dem Gewicht.
  - action: mqtt.publish
    data:
      topic: openScaleSync/inbound/1/{{ ts }}
      retain: true
      qos: 1
      payload: '{% if fett_ok %}{{ {''date'': ts, ''weight'': weight, ''body_fat'':
        fett | float} | to_json }}{% else %}{{ {''date'': ts, ''weight'': weight}
        | to_json }}{% endif %}'
    note: 'Payload laut openScale-sync-Wiki MQTT support: date in epoch ms, weight
      kg, body_fat %. userId 1 = Marcel in openScale.'
  mode: queued
  max: 10
- id: '1795456254372'
  alias: BodyOS Trainingszähler Wochenstart
  description: Setzt Sport- und Yoga-Zähler der BodyOS-Trainingswoche montags 00:00
    auf 0.
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: time
    weekday:
    - mon
  actions:
  - action: counter.reset
    target:
      entity_id:
      - counter.bodyos_sport_woche
      - counter.bodyos_yoga_woche
  mode: single
- id: luftreiniger_zeitplan
  alias: Luftreiniger Zeitplan (Nachtmodus)
  description: Abends in den leisesten Modus (So-Do und Fr-Sa getrennte Zeiten), morgens
    zurück auf Auto. Nur wenn der jeweilige Zeitplan-Schalter an ist und der Reiniger
    läuft. Wohnzimmer = Philips 1000i (Preset sleep), Schlafzimmer = IKEA Starkvind
    (Stufe 1 = 11 %). Zeiten in den input_datetime-Helfern, einstellbar auf der Seite
    Luftreiniger im Dashboard Zuhause.
  triggers:
  - trigger: time
    at: input_datetime.luftreiniger_wz_nacht_so_do
    id: wz_nacht_woche
  - trigger: time
    at: input_datetime.luftreiniger_wz_nacht_fr_sa
    id: wz_nacht_we
  - trigger: time
    at: input_datetime.luftreiniger_wz_morgens_auto
    id: wz_morgen
  - trigger: time
    at: input_datetime.luftreiniger_sz_nacht_so_do
    id: sz_nacht_woche
  - trigger: time
    at: input_datetime.luftreiniger_sz_nacht_fr_sa
    id: sz_nacht_we
  - trigger: time
    at: input_datetime.luftreiniger_sz_morgens_auto
    id: sz_morgen
  conditions: []
  actions:
  - choose:
    - alias: 'Wohnzimmer: Nachtmodus'
      conditions:
      - condition: state
        entity_id: input_boolean.luftreiniger_wz_zeitplan
        state: 'on'
      - condition: state
        entity_id: fan.ac1715_cloud_luftreiniger
        state: 'on'
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: wz_nacht_woche
          - condition: time
            weekday:
            - sun
            - mon
            - tue
            - wed
            - thu
        - condition: and
          conditions:
          - condition: trigger
            id: wz_nacht_we
          - condition: time
            weekday:
            - fri
            - sat
      sequence:
      - action: fan.set_preset_mode
        target:
          entity_id: fan.ac1715_cloud_luftreiniger
        data:
          preset_mode: sleep
    - alias: 'Wohnzimmer: morgens zurück auf Auto'
      conditions:
      - condition: trigger
        id: wz_morgen
      - condition: state
        entity_id: input_boolean.luftreiniger_wz_zeitplan
        state: 'on'
      - condition: state
        entity_id: fan.ac1715_cloud_luftreiniger
        attribute: preset_mode
        state: sleep
      sequence:
      - action: fan.set_preset_mode
        target:
          entity_id: fan.ac1715_cloud_luftreiniger
        data:
          preset_mode: auto
    - alias: 'Schlafzimmer: Nachtmodus (Stufe 1)'
      conditions:
      - condition: state
        entity_id: input_boolean.luftreiniger_sz_zeitplan
        state: 'on'
      - condition: state
        entity_id: fan.luftreiniger_schlafzimmer
        state: 'on'
      - condition: or
        conditions:
        - condition: and
          conditions:
          - condition: trigger
            id: sz_nacht_woche
          - condition: time
            weekday:
            - sun
            - mon
            - tue
            - wed
            - thu
        - condition: and
          conditions:
          - condition: trigger
            id: sz_nacht_we
          - condition: time
            weekday:
            - fri
            - sat
      sequence:
      - action: fan.set_percentage
        target:
          entity_id: fan.luftreiniger_schlafzimmer
        data:
          percentage: 11
    - alias: 'Schlafzimmer: morgens zurück auf Auto'
      conditions:
      - condition: trigger
        id: sz_morgen
      - condition: state
        entity_id: input_boolean.luftreiniger_sz_zeitplan
        state: 'on'
      - condition: state
        entity_id: fan.luftreiniger_schlafzimmer
        state: 'on'
      - condition: numeric_state
        entity_id: fan.luftreiniger_schlafzimmer
        attribute: percentage
        below: 12
      sequence:
      - action: fan.set_preset_mode
        target:
          entity_id: fan.luftreiniger_schlafzimmer
        data:
          preset_mode: auto
  mode: queued
- id: '1795601973089'
  alias: 'Abfall: Erinnerung am Vorabend'
  description: '18 Uhr Push an Marcel, wenn morgen Restmüll, Biotonne, Papier oder
    Gelber Sack abgeholt wird. Quellen: Waste Collection Schedule (insert-it Lübeck
    ICS, Gelber Sack Bezirk J statisch). Angelegt 25.11.2026.'
  triggers:
  - trigger: time
    at: '18:00:00'
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.abfall_restmull
      attribute: daysTo
      above: 0
      below: 2
    - condition: numeric_state
      entity_id: sensor.abfall_biotonne
      attribute: daysTo
      above: 0
      below: 2
    - condition: numeric_state
      entity_id: sensor.abfall_papier
      attribute: daysTo
      above: 0
      below: 2
    - condition: numeric_state
      entity_id: sensor.abfall_gelber_sack
      attribute: daysTo
      above: 0
      below: 2
  actions:
  - variables:
      tonnen:
        sensor.abfall_restmull: Restmüll
        sensor.abfall_biotonne: Biotonne
        sensor.abfall_papier: Papier
        sensor.abfall_gelber_sack: Gelber Sack
      morgen: '{% set ns = namespace(l=[]) %}{% for e, n in tonnen.items() if is_state_attr(e,
        ''daysTo'', 1) %}{% set ns.l = ns.l + [n] %}{% endfor %}{{ ns.l }}'
  - action: notify.mobile_app_sm_f741b
    data:
      title: 'Morgen Abfuhr: {{ morgen | join('' + '') }}'
      message: Heute Abend rausstellen.{% if 'Gelber Sack' in morgen %} Gelbe Säcke
        müssen bis 6 Uhr am Straßenrand stehen.{% endif %}
      data:
        tag: abfall-morgen
        clickAction: /dashboard-haushalt/uebersicht
  mode: single
- id: '1795625170478'
  alias: Wecker bei Abwesenheit pausieren
  description: 'Echo-Spot-Wecker (Alexa Media Player) aus, wenn Marcel und Sarah beide
    ausdrücklich nicht zu Hause sind (unknown zählt nicht) und die Wohnungstür seit
    30 min abgeschlossen ist; in der Zeit neu gestellte Wecker ebenso. Jemand kommt
    heim oder Tür wird aufgeschlossen: gemerkte Wecker wieder an. Anzeige: wecker-card,
    zuhause-card, willkommen-card.'
  triggers:
  - trigger: template
    id: weg
    value_template: '{{ states(''person.sauerm'') not in [''home'',''unknown'',''unavailable'']
      and states(''person.sarah'') not in [''home'',''unknown'',''unavailable''] and
      is_state(''lock.wohnungstur'',''locked'') }}'
    for: 00:30:00
  - trigger: state
    id: neu
    entity_id: sensor.echo_spot_schlafzimmer_nachster_alarm
    attribute: total_active
  - trigger: state
    id: da
    entity_id:
    - person.sauerm
    - person.sarah
    to: home
  - trigger: state
    id: da
    entity_id: lock.wohnungstur
    from: locked
  - trigger: homeassistant
    event: start
    id: start
  conditions: []
  actions:
  - variables:
      weg: '{{ states(''person.sauerm'') not in [''home'',''unknown'',''unavailable'']
        and states(''person.sarah'') not in [''home'',''unknown'',''unavailable'']
        and is_state(''lock.wohnungstur'',''locked'') }}'
      aktive: '{{ (state_attr(sensor,''sorted_active'') or []) | selectattr(''type'',''eq'',''Alarm'')
        | map(attribute=''id'') | list }}'
      gemerkt: '{{ states(store).split('','') | map(''trim'') | select(''search'',''-'')
        | list }}'
  - choose:
    - alias: 'Beide weg, Tür zu: aktive Wecker ausschalten und merken'
      conditions:
      - condition: template
        value_template: '{{ weg and aktive | count > 0 and (trigger.id in [''weg'',''start'']
          or is_state(flag,''on'')) }}'
      sequence:
      - repeat:
          for_each: '{{ aktive }}'
          sequence:
          - action: alexa_media.disable_alarm
            continue_on_error: true
            data:
              entity_id: '{{ mp }}'
              alarm_id: '{{ repeat.item }}'
      - action: input_text.set_value
        target:
          entity_id: '{{ store }}'
        data:
          value: '{{ (gemerkt + aktive) | unique | join('','') }}'
      - action: input_boolean.turn_on
        target:
          entity_id: '{{ flag }}'
    - alias: 'Jemand da oder Tür auf: gemerkte Wecker wieder an'
      conditions:
      - condition: template
        value_template: '{{ not weg and is_state(flag,''on'') }}'
      sequence:
      - repeat:
          for_each: '{{ gemerkt }}'
          sequence:
          - action: alexa_media.enable_alarm
            continue_on_error: true
            data:
              entity_id: '{{ mp }}'
              alarm_id: '{{ repeat.item }}'
      - action: input_text.set_value
        target:
          entity_id: '{{ store }}'
        data:
          value: ''
      - action: input_boolean.turn_off
        target:
          entity_id: '{{ flag }}'
  mode: queued
  max: 10
  variables:
    mp: media_player.echo_spot_schlafzimmer
    sensor: sensor.echo_spot_schlafzimmer_nachster_alarm
    flag: input_boolean.wecker_abwesenheit_pausiert
    store: input_text.wecker_pausierte_ids
- id: '1795731883371'
  alias: Bilderrahmen – nach Verbindung neu laden
  description: 'Frameware meldet sich per MQTT online (nach WLAN-Rückkehr oder Neustart):
    Seite neu laden und Diashow starten. Nutzt nur MQTT-Topics, unabhängig von Entity-IDs.
    Gerät device_id 430728fb (Frameware 0.2.0, seit 27.11.2026; vorher Kiosk OSS kioskoss/65d78e53).'
  mode: single
  triggers:
  - trigger: mqtt
    topic: frameware/430728fb/availability
    payload: online
  actions:
  - delay: 00:00:10
  - action: mqtt.publish
    data:
      topic: frameware/430728fb/cmd/reload
      payload: ''
  - delay: 00:00:15
  - action: mqtt.publish
    data:
      topic: frameware/430728fb/cmd/screensaver
      payload: 'ON'
- id: '1795785059902'
  alias: Bilderrahmen – nach 10 s zurück zur Diashow
  description: 'Berührung zeigt den Spiegel (Frameware beendet dabei den Schoner, switch.bilderrahmen_screensaver
    geht auf off). Nach 10 s ohne erneuten Wechsel wird die Diashow (Immich Kiosk) wieder eingeschaltet.
    Ersetzt den Leerlauf-Timer der App (nur in Minuten, in 0.2.1 außerdem defekt). Nur wenn das Display an ist.'
  triggers:
  - trigger: state
    entity_id: switch.bilderrahmen_screensaver
    to: 'off'
    for:
      seconds: 10
  conditions:
  - condition: state
    entity_id: switch.bilderrahmen_screen
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.bilderrahmen_screensaver
  mode: restart
- id: '1795789352841'
  alias: Smäudex – Kalender alle 30 min neu laden
  description: Remote Calendar holt die iCal-Adresse von Google sonst nur selten. Termine, die im Google Kalender neu angelegt oder geändert werden, erscheinen so spätestens nach 30 min im Spiegel. Entry Smäudex (remote_calendar).
  triggers:
  - trigger: time_pattern
    minutes: /30
