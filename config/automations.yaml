- id: '1781716502903'
  alias: Bürolicht mit Präsenzmelder
  description: Präsenz im Büro -> Ambilight an, aber nur wenn jemand zu Hause ist
    (unabhängig von der Helligkeit). Keine Präsenz mehr -> aus. Hintergrund für die
    Bedingung und die gesenkte Melder-Empfindlichkeit (Bewegung 7, Stillstand 6, Reichweite
    4 m) waren Fehlalarme, während niemand zu Hause war.
  triggers:
  - trigger: state
    entity_id: binary_sensor.prasenzmelder_buro_presence
    to: 'on'
    id: presence_on
  - trigger: state
    entity_id:
    - binary_sensor.prasenzmelder_buro_presence
    to:
    - 'off'
    - unavailable
    - unknown
    id: presence_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_on
      - condition: template
        value_template: '{{ persons | select(''is_state'', ''home'') | list | count
          > 0 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ office_light }}'
        data:
          brightness_pct: 100
    - conditions:
      - condition: trigger
        id: presence_off
      sequence:
      - action: light.turn_off
        target:
          entity_id: '{{ office_light }}'
  mode: restart
  variables:
    office_light: light.ambilight_buro
    persons:
    - person.sauerm
    - person.sarah
- id: '1783672945400'
  alias: Präsenzmelder Badezimmer
  description: Präsenz im Bad -> Hintergrundbeleuchtung auf 50 %. Nach Sonnenuntergang
    immer, mit 1 s Verzögerung, damit die Tür zum Schlafzimmer zu ist. Tagsüber nur
    unter 50 lx; bei höherem Wert bis 2 s auf einen frischen Sensorwert warten, weil
    der alte Wert vom eigenen Licht stammen kann. Keine Präsenz mehr -> aus.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.prasenzmelder_badezimmer_presence
    to:
    - 'on'
    id: presence_on
  - trigger: state
    entity_id:
    - binary_sensor.prasenzmelder_badezimmer_presence
    to:
    - 'off'
    id: presence_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: presence_on
      sequence:
      - if:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        then:
        - delay:
            seconds: 1
      - if:
        - condition: state
          entity_id: sun.sun
          state: above_horizon
        - condition: not
          conditions:
          - condition: numeric_state
            entity_id: sensor.prasenzmelder_badezimmer_illuminance
            below: 50
        then:
        - wait_for_trigger:
          - trigger: state
            entity_id: sensor.prasenzmelder_badezimmer_illuminance
          timeout:
            seconds: 2
          continue_on_timeout: true
      - condition: or
        conditions:
        - condition: state
          entity_id: sun.sun
          state: below_horizon
        - condition: numeric_state
          entity_id: sensor.prasenzmelder_badezimmer_illuminance
          below: 50
      - action: light.turn_on
        data:
          brightness_pct: 50
        target:
          entity_id: light.badezimmerlicht_hintergrundbeleuchtung
    - conditions:
      - condition: trigger
        id: presence_off
      sequence:
      - action: light.turn_off
        data: {}
        target:
          entity_id: light.badezimmerlicht_hintergrundbeleuchtung
  mode: restart
