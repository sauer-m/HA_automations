- id: '1778234891063'
  alias: Lichtsteuerung - Wohnzimmer Hauptlicht
  description: ''
  triggers:
  - entity_id: event.schalter_wohnzimmer_input_1_l
    id: shelly_event
    trigger: state
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''single_push''
          }}

          '
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(light_entity, ''off'') }}'
          sequence:
          - target:
              entity_id: '{{ light_entity }}'
            action: light.turn_on
          - target:
              entity_id: '{{ dim_direction_helper }}'
            action: input_boolean.turn_off
        default:
        - target:
            entity_id: '{{ light_entity }}'
          action: light.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''double_push''
          }}

          '
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          brightness_pct: 100
        action: light.turn_on
      - target:
          entity_id: '{{ dim_direction_helper }}'
        action: input_boolean.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''triple_push''
          }}

          '
      sequence:
      - target:
          entity_id: '{{ light_entity }}'
        data:
          brightness_pct: 100
          color_temp_kelvin: '{{ warm_white_kelvin }}'
        action: light.turn_on
      - target:
          entity_id: '{{ dim_direction_helper }}'
        action: input_boolean.turn_off
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''btn_down''
          }}

          '
      sequence:
      - delay:
          milliseconds: '{{ hold_delay }}'
      - variables:
          dim_up: '{{ is_state(dim_direction_helper, ''on'') }}'
      - target:
          entity_id: '{{ dim_direction_helper }}'
        action: input_boolean.toggle
      - repeat:
          while:
          - condition: template
            value_template: "{% set brightness = state_attr(light_entity, 'brightness')
              | int(0) %} {% set brightness_pct = (brightness / 255 * 100) | round(0)
              | int %} {{ is_state(light_entity, 'on')\n   and (\n     (dim_up and
              brightness_pct < 100)\n     or\n     ((not dim_up) and brightness_pct
              > 1)\n   )\n}}\n"
          sequence:
          - target:
              entity_id: '{{ light_entity }}'
            data:
              brightness_pct: "{% set brightness = state_attr(light_entity, 'brightness')
                | int(0) %} {% set brightness_pct = (brightness / 255 * 100) | round(0)
                | int %} {% if dim_up %}\n  {{ [brightness_pct + dim_step, 100] |
                min }}\n{% else %}\n  {{ [brightness_pct - dim_step, 1] | max }}\n{%
                endif %}\n"
              transition: 0.4
            action: light.turn_on
          - delay:
              milliseconds: '{{ dim_interval }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''btn_up'' }}

          '
      sequence: []
  mode: restart
  variables:
    light_entity: light.wohnzimmerlicht
    dim_direction_helper: input_boolean.shelly_dimmrichtung_hoch_wz
    hold_delay: 500
    dim_step: 2
    dim_interval: 500
    warm_white_kelvin: 2700
