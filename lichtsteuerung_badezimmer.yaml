alias: Lichtsteuerung Badezimmerlicht
description: Shelly-Taster Badezimmer. Läuft nur, wenn light.badezimmerlicht erreichbar ist; sonst übernimmt das Shelly-Skript
  (Relais-Fallback). Reagiert die Lampe auf Einfach-Druck nicht innerhalb von response_timeout_s, schaltet die Automation
  das Relais.
mode: restart
variables:
  main_light: light.badezimmerlicht
  input_0: event.badezimmer_lichtschalter_badezimmer_eingang_1
  input_1: event.badezimmer_lichtschalter_badezimmer_eingang_0
  dim_step: 10
  warm_step_kelvin: 500
  cold_step_kelvin: 500
  min_kelvin: 3000
  max_kelvin: 6500
  relay_switch: switch.badezimmer_schaltausgang_badezimmerlicht
  response_timeout_s: 5
triggers:
- trigger: state
  entity_id:
  - event.badezimmer_lichtschalter_badezimmer_eingang_0
  - event.badezimmer_lichtschalter_badezimmer_eingang_1
  not_from:
  - unavailable
  - unknown
conditions:
- condition: template
  value_template: '{{ states(main_light) not in [''unavailable'', ''unknown''] }}'
actions:
- variables:
    event_type: '{{ trigger.to_state.attributes.event_type | default('''') }}'
    current_brightness_pct: |
      {% set b = state_attr(main_light, 'brightness') | int(0) %} {{ (b / 255 * 100) | round(0) | int }}
    current_kelvin: |
      {{ state_attr(main_light, 'color_temp_kelvin') | int(4757) }}
- choose:
  - conditions:
    - condition: template
      value_template: |
        {{ event_type in ['single_push', 'Single push', 'single'] }}
    sequence:
    - variables:
        state_before: '{{ states(main_light) }}'
    - action: light.toggle
      target:
        entity_id: '{{ main_light }}'
    - wait_template: '{{ states(main_light) != state_before }}'
      timeout:
        seconds: '{{ response_timeout_s }}'
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: switch.toggle
        target:
          entity_id: '{{ relay_switch }}'
  - conditions:
    - condition: template
      value_template: |
        {{ event_type in ['double_push', 'Double push', 'double'] }}
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ main_light }}'
      data:
        brightness_pct: |
          {% set b = state_attr(main_light, 'brightness') | int(0) %} {% set pct = (b / 255 * 100) | round(0) | int %} {{ 10 if pct >= 99 else 100 }}
  - conditions:
    - condition: template
      value_template: |
        {{ trigger.entity_id == input_0
           and event_type in ['long_push', 'Long push', 'long'] }}
    sequence:
    - if:
      - condition: template
        value_template: '{{ is_state(main_light, ''off'') }}'
      then:
      - action: light.turn_on
        target:
          entity_id: '{{ main_light }}'
        data:
          brightness_pct: 10
    - repeat:
        while:
        - condition: template
          value_template: |
            {{ (state_attr(main_light, 'brightness') | int(0) / 255 * 100) < 80 }}
        sequence:
        - action: light.turn_on
          target:
            entity_id: '{{ main_light }}'
          data:
            brightness_step_pct: 2
            transition: 0.2
        - delay:
            milliseconds: 250
  - conditions:
    - condition: template
      value_template: |
        {{ trigger.entity_id == input_1
           and event_type in ['long_push', 'Long push', 'long'] }}
    sequence:
    - repeat:
        while:
        - condition: template
          value_template: |
            {{ (state_attr(main_light, 'brightness') | int(0) / 255 * 100) > 10 }}
        sequence:
        - action: light.turn_on
          target:
            entity_id: '{{ main_light }}'
          data:
            brightness_step_pct: -2
            transition: 0.2
        - delay:
            milliseconds: 250
  - conditions:
    - condition: template
      value_template: |
        {{ trigger.entity_id == input_0
           and event_type in ['triple_push', 'Triple push', 'triple'] }}
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ main_light }}'
      data:
        color_temp_kelvin: |
          {{ [current_kelvin - warm_step_kelvin, min_kelvin] | max }}
  - conditions:
    - condition: template
      value_template: |
        {{ trigger.entity_id == input_1
           and event_type in ['triple_push', 'Triple push', 'triple'] }}
    sequence:
    - action: light.turn_on
      target:
        entity_id: '{{ main_light }}'
      data:
        color_temp_kelvin: |
          {{ [current_kelvin + cold_step_kelvin, max_kelvin] | min }}
